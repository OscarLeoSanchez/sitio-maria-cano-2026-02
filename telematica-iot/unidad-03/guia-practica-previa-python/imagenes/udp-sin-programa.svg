<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 812 202" width="812" height="202" role="img" aria-labelledby="t d">
<title id="t">Windows PowerShell</title>
<desc id="d">Salida de ejemplo de cliente_udp.py cuando nadie espera en el mismo equipo: un error ConnectionResetError con el código 10054</desc>
<g transform="translate(0,0)">
<rect width="812" height="202" rx="10" fill="#012456"/>
<path d="M0,10 a10,10 0 0 1 10,-10 H802 a10,10 0 0 1 10,10 V34 H0 Z" fill="#2b2b2b"/>
<text x="14" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#e6e6e6">Windows PowerShell</text>
<g stroke="#bbbbbb" stroke-width="1.4" fill="none"><path d="M716,17 h10"/><rect x="750" y="12" width="10" height="10"/><path d="M784,12 l10,10 M794,12 l-10,10"/></g>
<rect x="16.0" y="150" width="304.2" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<g font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="13" fill="#eeedf0">
<text x="18" y="63" textLength="379.2" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PS C:\Users\estudiante\u3&gt; python cliente_udp.py</text>
<text x="18" y="83" textLength="268.6" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Traceback (most recent call last):</text>
<text x="18" y="103" textLength="529.3" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">  File "C:\Users\estudiante\u3\cliente_udp.py", line 7, in &lt;module&gt;</text>
<text x="18" y="123" textLength="284.4" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">    print(cliente.recvfrom(1024)[0])</text>
<text x="18" y="143" textLength="244.9" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">          ~~~~~~~~~~~~~~~~^^^^^</text>
<text x="18" y="163" textLength="742.6" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">ConnectionResetError: [WinError 10054] Se ha forzado la interrupción de una conexión existente</text>
<text x="18" y="183" textLength="142.2" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">por el host remoto</text>
</g>
