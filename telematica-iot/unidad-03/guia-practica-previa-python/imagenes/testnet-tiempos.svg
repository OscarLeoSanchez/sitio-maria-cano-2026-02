<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 496 434" width="496" height="434" role="img" aria-labelledby="t d">
<title id="t">Windows PowerShell, alguien espera</title>
<desc id="d">Tres medidas con Test-NetConnection en modo Quiet: con alguien esperando da True en poco más de un segundo, con el número cerrado da False en unos tres segundos y con una dirección que no existe da False en unos veintidós segundos</desc>
