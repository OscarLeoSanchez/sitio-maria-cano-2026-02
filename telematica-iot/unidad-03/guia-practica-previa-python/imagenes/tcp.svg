<text x="18" y="83" textLength="221.2" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Escuchando en el puerto 5000</text>
<text x="18" y="103" textLength="221.2" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Conecto ('127.0.0.1', 49843)</text>
<text x="18" y="123" textLength="213.3" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Recibio b'temperatura=24.5'</text>
