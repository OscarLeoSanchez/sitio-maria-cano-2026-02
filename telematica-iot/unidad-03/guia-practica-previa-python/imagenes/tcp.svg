<title id="t">Windows PowerShell, consola 1 (la que espera)</title>
<desc id="d">Dos consolas con los programas de TCP: la primera queda esperando, muestra de dónde llegó la llamada y lo que recibió; la segunda muestra la respuesta y cuánto tardó</desc>
