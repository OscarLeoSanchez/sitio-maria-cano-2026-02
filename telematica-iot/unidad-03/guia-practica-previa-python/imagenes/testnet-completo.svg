<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 702 518" width="702" height="518" role="img" aria-labelledby="t d">
<title id="t">Windows PowerShell, alguien espera</title>
<desc id="d">Dos salidas de Test-NetConnection con el número 5000: a la izquierda una donde TcpTestSucceeded es True y otra donde es False</desc>
<g transform="translate(0,0)">
<rect width="702" height="222" rx="10" fill="#012456"/>
<path d="M0,10 a10,10 0 0 1 10,-10 H692 a10,10 0 0 1 10,10 V34 H0 Z" fill="#2b2b2b"/>
<text x="14" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#e6e6e6">Windows PowerShell, alguien espera</text>
<g stroke="#bbbbbb" stroke-width="1.4" fill="none"><path d="M606,17 h10"/><rect x="640" y="12" width="10" height="10"/><path d="M674,12 l10,10 M684,12 l-10,10"/></g>
<rect x="166.1" y="190" width="35.6" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<g font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="13" fill="#eeedf0">
<text x="18" y="63" textLength="632.0" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PS C:\Users\estudiante\u3&gt; Test-NetConnection -ComputerName 127.0.0.1 -Port 5000</text>
<text x="18" y="103" textLength="221.2" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">ComputerName     : 127.0.0.1</text>
<text x="18" y="123" textLength="221.2" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">RemoteAddress    : 127.0.0.1</text>
<text x="18" y="143" textLength="181.7" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">RemotePort       : 5000</text>
<text x="18" y="163" textLength="363.4" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">InterfaceAlias   : Loopback Pseudo-Interface 1</text>
<text x="18" y="183" textLength="221.2" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">SourceAddress    : 127.0.0.1</text>
<text x="18" y="203" textLength="181.7" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">TcpTestSucceeded : True</text>
</g>
<circle cx="211.7" cy="191.0" r="9.5" fill="#f2b33d" stroke="#012456" stroke-width="1.5"/>
<text x="211.7" y="195.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2a24">1</text>
</g>
<g transform="translate(0,236)">
<rect width="702" height="282" rx="10" fill="#012456"/>
<path d="M0,10 a10,10 0 0 1 10,-10 H692 a10,10 0 0 1 10,10 V34 H0 Z" fill="#2b2b2b"/>
<text x="14" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#e6e6e6">Windows PowerShell, nadie espera</text>
<g stroke="#bbbbbb" stroke-width="1.4" fill="none"><path d="M606,17 h10"/><rect x="640" y="12" width="10" height="10"/><path d="M674,12 l10,10 M684,12 l-10,10"/></g>
<rect x="213.5" y="250" width="43.5" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<g font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="13" fill="#eeedf0">
<text x="18" y="63" textLength="632.0" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PS C:\Users\estudiante\u3&gt; Test-NetConnection -ComputerName 127.0.0.1 -Port 5000</text>
<text x="18" y="83" textLength="418.7" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">ADVERTENCIA: TCP connect to (127.0.0.1 : 5000) failed</text>
<text x="18" y="123" textLength="268.6" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">ComputerName           : 127.0.0.1</text>
<text x="18" y="143" textLength="268.6" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">RemoteAddress          : 127.0.0.1</text>
<text x="18" y="163" textLength="229.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">RemotePort             : 5000</text>
<text x="18" y="183" textLength="410.8" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">InterfaceAlias         : Loopback Pseudo-Interface 1</text>
<text x="18" y="203" textLength="268.6" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">SourceAddress          : 127.0.0.1</text>
<text x="18" y="223" textLength="229.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PingSucceeded          : True</text>
<text x="18" y="243" textLength="229.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PingReplyDetails (RTT) : 0 ms</text>
<text x="18" y="263" textLength="237.0" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">TcpTestSucceeded       : False</text>
</g>
<circle cx="267.0" cy="251.0" r="9.5" fill="#f2b33d" stroke="#012456" stroke-width="1.5"/>
<text x="267.0" y="255.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2a24">2</text>
</g>
</svg>
