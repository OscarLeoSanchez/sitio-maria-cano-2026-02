<svg width="760" height="172" viewBox="0 0 760 172" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Quién espera y quién pide. A la izquierda la consola con python -m http.server espera y no hace nada hasta que la llaman. A la derecha el navegador pide GET barra, y la consola responde con el código 200 y la lista de archivos" font-family="Segoe UI, Inter, system-ui, sans-serif">
<defs><marker id="pf3" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6876"/></marker></defs>
<rect x="30" y="40" width="230" height="90" rx="8" fill="#ece6fa" stroke="#bfb0e8"/>
<text x="145.0" y="80.5" font-size="13" font-weight="400" fill="#12324f" text-anchor="middle">Consola con</text>
<text x="145.0" y="98.5" font-size="13" font-weight="700" fill="#12324f" text-anchor="middle" font-family="Consolas, Courier New, monospace">python -m http.server</text>
<rect x="500" y="40" width="230" height="90" rx="8" fill="#ece6fa" stroke="#bfb0e8"/>
<text x="615.0" y="80.5" font-size="13" font-weight="700" fill="#12324f" text-anchor="middle">Navegador</text>
<text x="615.0" y="98.5" font-size="13" font-weight="400" fill="#12324f" text-anchor="middle" font-family="Consolas, Courier New, monospace">http://127.0.0.1:8000</text>
<path d="M500,72 L260,72" fill="none" stroke="#5b6876" stroke-width="1.8" marker-end="url(#pf3)"/>
<path d="M260,100 L500,100" fill="none" stroke="#5b6876" stroke-width="1.8" marker-end="url(#pf3)"/>
<text x="380" y="64" font-size="12.5" font-weight="700" fill="#12324f" text-anchor="middle">pide: GET /</text>
<text x="380" y="120" font-size="12.5" font-weight="700" fill="#12324f" text-anchor="middle">responde: 200 y la lista</text>
<text x="145" y="156" font-size="12" font-weight="400" fill="#5b6876" text-anchor="middle">Espera. No hace nada hasta que lo llaman.</text>
<text x="615" y="156" font-size="12" font-weight="400" fill="#5b6876" text-anchor="middle">Pide. Toma la iniciativa.</text>
<text x="380" y="20" font-size="14" font-weight="700" fill="#12324f" text-anchor="middle">Quién espera y quién pide</text>
</svg>
