<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 472 262" width="472" height="262" role="img" aria-labelledby="t d">
<title id="t">Windows PowerShell</title>
<desc id="d">Salida de bits.py con dos direcciones: cada una como número y en bits, y una línea con un signo ^ bajo cada bit que cambia</desc>
<g transform="translate(0,0)">
<rect width="472" height="262" rx="10" fill="#012456"/>
<path d="M0,10 a10,10 0 0 1 10,-10 H462 a10,10 0 0 1 10,10 V34 H0 Z" fill="#2b2b2b"/>
<text x="14" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#e6e6e6">Windows PowerShell</text>
<g stroke="#bbbbbb" stroke-width="1.4" fill="none"><path d="M376,17 h10"/><rect x="410" y="12" width="10" height="10"/><path d="M444,12 l10,10 M454,12 l-10,10"/></g>
<rect x="126.6" y="110" width="280.5" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<rect x="355.7" y="190" width="51.4" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<rect x="237.2" y="210" width="19.8" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<g font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="13" fill="#eeedf0">
<text x="18" y="63" textLength="323.9" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PS C:\Users\estudiante\u3&gt; python bits.py</text>
<text x="18" y="83" textLength="213.3" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Tu direccion: 192.168.10.20</text>
<text x="18" y="103" textLength="197.5" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Como numero:   3232238100</text>
<text x="18" y="123" textLength="387.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">En bits:      11000000.10101000.00001010.00010100</text>
<text x="18" y="143" textLength="402.9" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Otra direccion (Enter para terminar): 192.168.10.45</text>
<text x="18" y="163" textLength="197.5" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Como numero:   3232238125</text>
<text x="18" y="183" textLength="387.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">En bits:      11000000.10101000.00001010.00101101</text>
<text x="18" y="203" textLength="387.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Cambian:                                   ^^^  ^</text>
<text x="18" y="223" textLength="237.0" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Iguales desde la izquierda: 26</text>
<text x="18" y="243" textLength="292.3" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Otra direccion (Enter para terminar):</text>
</g>
<circle cx="417.1" cy="111.0" r="9.5" fill="#f2b33d" stroke="#012456" stroke-width="1.5"/>
<text x="417.1" y="115.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2a24">1</text>
<circle cx="417.1" cy="191.0" r="9.5" fill="#f2b33d" stroke="#012456" stroke-width="1.5"/>
<text x="417.1" y="195.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2a24">2</text>
<circle cx="267.0" cy="211.0" r="9.5" fill="#f2b33d" stroke="#012456" stroke-width="1.5"/>
<text x="267.0" y="215.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2a24">3</text>
</g>
</svg>
