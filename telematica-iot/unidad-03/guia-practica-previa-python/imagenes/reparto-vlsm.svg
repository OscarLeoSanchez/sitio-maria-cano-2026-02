<text x="250" y="176" font-size="12.5" font-weight="400" fill="#12324f" text-anchor="start">16 direcciones</text>
<text x="400" y="176" font-size="12.5" font-weight="400" fill="#12324f" text-anchor="start">caben 14</text>
