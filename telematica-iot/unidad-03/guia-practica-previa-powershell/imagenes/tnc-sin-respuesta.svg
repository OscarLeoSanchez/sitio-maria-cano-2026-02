<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 382" width="1270" height="382" role="img" aria-labelledby="t d">
<title id="t">Windows PowerShell</title>
<desc id="d">Salida de ejemplo de Test-NetConnection hacia una dirección que no contesta: dos advertencias, PingSucceeded y TcpTestSucceeded en False, y una espera de unos treinta y cinco segundos</desc>
<rect width="1270" height="382" rx="10" fill="#0c0c0c"/>
<path d="M0,10 a10,10 0 0 1 10,-10 H1260 a10,10 0 0 1 10,10 V34 H0 Z" fill="#2b2b2b"/>
<text x="14" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#e6e6e6">Windows PowerShell</text>
<g stroke="#bbbbbb" stroke-width="1.4" fill="none"><path d="M1174,17 h10"/><rect x="1208" y="12" width="10" height="10"/><path d="M1242,12 l10,10 M1252,12 l-10,10"/></g>
<rect x="268.8" y="90" width="225.2" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<rect x="213.5" y="250" width="43.5" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<rect x="213.5" y="290" width="43.5" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<rect x="63.4" y="350" width="106.7" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<g font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="13" fill="#cccccc">
<text x="18" y="63" textLength="1200.8" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PS C:\Users\estudiante-a\practica-u3&gt; $t = Get-Date; Test-NetConnection 192.0.2.99 -Port 5000; "Tardo {0:N1} segundos" -f ((Get-Date) - $t).TotalSeconds</text>
<text x="18" y="83" textLength="426.6" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">ADVERTENCIA: TCP connect to (192.0.2.99 : 5000) failed</text>
<text x="18" y="103" textLength="474.0" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">ADVERTENCIA: Ping to 192.0.2.99 failed with status: TimedOut</text>
<text x="18" y="163" textLength="276.5" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">ComputerName           : 192.0.2.99</text>
<text x="18" y="183" textLength="276.5" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">RemoteAddress          : 192.0.2.99</text>
<text x="18" y="203" textLength="229.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">RemotePort             : 5000</text>
<text x="18" y="223" textLength="260.7" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">InterfaceAlias         : Ethernet</text>
<text x="18" y="243" textLength="300.2" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">SourceAddress          : 192.168.10.20</text>
<text x="18" y="263" textLength="237.0" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PingSucceeded          : False</text>
<text x="18" y="283" textLength="229.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PingReplyDetails (RTT) : 0 ms</text>
<text x="18" y="303" textLength="237.0" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">TcpTestSucceeded       : False</text>
<text x="18" y="363" textLength="150.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Tardo 34,9 segundos</text>
</g>
