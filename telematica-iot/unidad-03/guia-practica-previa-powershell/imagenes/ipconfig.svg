<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 607 302" width="607" height="302" role="img" aria-labelledby="t d">
<title id="t">Windows PowerShell</title>
<desc id="d">Salida de ejemplo de ipconfig con la dirección IPv4 y la puerta de enlace predeterminada resaltadas</desc>
<rect width="607" height="302" rx="10" fill="#0c0c0c"/>
<path d="M0,10 a10,10 0 0 1 10,-10 H597 a10,10 0 0 1 10,10 V34 H0 Z" fill="#2b2b2b"/>
<text x="14" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#e6e6e6">Windows PowerShell</text>
<g stroke="#bbbbbb" stroke-width="1.4" fill="none"><path d="M511,17 h10"/><rect x="545" y="12" width="10" height="10"/><path d="M579,12 l10,10 M589,12 l-10,10"/></g>
<rect x="387.3" y="230" width="106.7" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<rect x="387.3" y="270" width="98.8" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<g font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="13" fill="#cccccc">
<text x="18" y="63" textLength="363.4" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PS C:\Users\estudiante-a\practica-u3&gt; ipconfig</text>
<text x="18" y="103" textLength="213.3" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Configuración IP de Windows</text>
<text x="18" y="163" textLength="244.9" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Adaptador de Ethernet Ethernet:</text>
<text x="18" y="203" textLength="371.3" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">   Sufijo DNS específico para la conexión. . : </text>
<text x="18" y="223" textLength="537.2" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">   Vínculo: dirección IPv6 local. . . : fe80::1c2a:5eff:fe00:5314%24</text>
<text x="18" y="243" textLength="474.0" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">   Dirección IPv4. . . . . . . . . . . . . . : 192.168.10.20</text>
<text x="18" y="263" textLength="489.8" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">   Máscara de subred . . . . . . . . . . . . : 255.255.255.192</text>
<text x="18" y="283" textLength="466.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">   Puerta de enlace predeterminada . . . . . : 192.168.10.1</text>
</g>
