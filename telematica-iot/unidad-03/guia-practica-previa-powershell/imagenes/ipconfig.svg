<text x="504.0" y="235.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2a24">1</text>
<circle cx="496.1" cy="271.0" r="9.5" fill="#f2b33d" stroke="#0c0c0c" stroke-width="1.5"/>
<text x="496.1" y="275.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2a24">2</text>
</svg>
