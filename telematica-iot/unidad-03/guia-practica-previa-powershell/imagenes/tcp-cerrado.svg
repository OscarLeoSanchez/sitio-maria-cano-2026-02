<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1018 122" width="1018" height="122" role="img" aria-labelledby="t d">
<title id="t">Windows PowerShell</title>
<desc id="d">Salida de ejemplo de cliente-tcp.ps1 cuando nadie espera en ese número: el sistema informa que el equipo de destino denegó expresamente la conexión y tarda unos dos segundos</desc>
<rect width="1018" height="122" rx="10" fill="#0c0c0c"/>
<path d="M0,10 a10,10 0 0 1 10,-10 H1008 a10,10 0 0 1 10,10 V34 H0 Z" fill="#2b2b2b"/>
<text x="14" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#e6e6e6">Windows PowerShell</text>
<g stroke="#bbbbbb" stroke-width="1.4" fill="none"><path d="M922,17 h10"/><rect x="956" y="12" width="10" height="10"/><path d="M990,12 l10,10 M1000,12 l-10,10"/></g>
<rect x="576.9" y="70" width="272.6" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<rect x="63.4" y="90" width="98.8" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<g font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="13" fill="#cccccc">
<text x="18" y="63" textLength="553.0" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PS C:\Users\estudiante-a\practica-u3&gt; .\cliente-tcp.ps1 127.0.0.1 5000</text>
<text x="18" y="83" textLength="948.0" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Fallo: No se puede establecer una conexión ya que el equipo de destino denegó expresamente dicha conexión 127.0.0.1:5000</text>
<text x="18" y="103" textLength="142.2" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Tardo 2,1 segundos</text>
</g>
