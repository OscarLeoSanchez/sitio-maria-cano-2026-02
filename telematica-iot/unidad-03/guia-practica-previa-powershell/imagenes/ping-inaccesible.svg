<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 551 242" width="551" height="242" role="img" aria-labelledby="t d">
<title id="t">Windows PowerShell</title>
<desc id="d">Dibujo de ejemplo de ping cuando el propio equipo informa que no pudo ubicar el destino: la respuesta viene de la dirección del propio equipo y dice Host de destino inaccesible</desc>
<rect width="551" height="242" rx="10" fill="#0c0c0c"/>
<path d="M0,10 a10,10 0 0 1 10,-10 H541 a10,10 0 0 1 10,10 V34 H0 Z" fill="#2b2b2b"/>
<text x="14" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#e6e6e6">Windows PowerShell</text>
<g stroke="#bbbbbb" stroke-width="1.4" fill="none"><path d="M455,17 h10"/><rect x="489" y="12" width="10" height="10"/><path d="M523,12 l10,10 M533,12 l-10,10"/></g>
<rect x="16.0" y="110" width="233.1" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
