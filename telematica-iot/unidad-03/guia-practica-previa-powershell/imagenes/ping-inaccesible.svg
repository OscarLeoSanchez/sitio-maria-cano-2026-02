<g font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="13" fill="#cccccc">
<text x="18" y="63" textLength="481.9" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PS C:\Users\estudiante-a\practica-u3&gt; ping -n 2 192.168.10.88</text>
<text x="18" y="103" textLength="410.8" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Haciendo ping a 192.168.10.88 con 32 bytes de datos:</text>
<text x="18" y="123" textLength="466.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Respuesta desde 192.168.10.20: Host de destino inaccesible.</text>
<text x="18" y="143" textLength="466.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Respuesta desde 192.168.10.20: Host de destino inaccesible.</text>
<text x="18" y="183" textLength="316.0" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Estadísticas de ping para 192.168.10.88:</text>
<text x="18" y="203" textLength="434.5" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">    Paquetes: enviados = 2, recibidos = 2, perdidos = 0</text>
<text x="18" y="223" textLength="142.2" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">    (0% perdidos),</text>
</g>
