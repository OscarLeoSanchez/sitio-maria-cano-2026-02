<text x="14" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#e6e6e6">Windows PowerShell</text>
<g stroke="#bbbbbb" stroke-width="1.4" fill="none"><path d="M724,17 h10"/><rect x="758" y="12" width="10" height="10"/><path d="M792,12 l10,10 M802,12 l-10,10"/></g>
<rect x="276.7" y="70" width="146.2" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<rect x="87.1" y="110" width="106.7" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<g font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="13" fill="#cccccc">
<text x="18" y="63" textLength="529.3" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PS C:\Users\estudiante-a\practica-u3&gt; .\servidor-web.ps1 8000 todas</text>
<text x="18" y="83" textLength="750.5" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Servidor listo en el puerto 8000 (abierto a la red). Carpeta: C:\Users\estudiante-a\practica-u3</text>
<text x="18" y="103" textLength="165.9" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Ctrl+C para cerrarlo.</text>
<text x="18" y="123" textLength="339.7" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">09:21:40 192.168.10.45 "GET / HTTP/1.1" 200</text>
<text x="18" y="143" textLength="426.6" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">09:21:40 192.168.10.45 "GET /favicon.ico HTTP/1.1" 404</text>
</g>
