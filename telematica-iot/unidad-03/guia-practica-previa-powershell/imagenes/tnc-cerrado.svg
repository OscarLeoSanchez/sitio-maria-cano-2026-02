<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1262 362" width="1262" height="362" role="img" aria-labelledby="t d">
<title id="t">Windows PowerShell</title>
<desc id="d">Salida de ejemplo de Test-NetConnection hacia un número donde nadie espera: aparece una advertencia, PingSucceeded es True y TcpTestSucceeded es False</desc>
<rect width="1262" height="362" rx="10" fill="#0c0c0c"/>
<path d="M0,10 a10,10 0 0 1 10,-10 H1252 a10,10 0 0 1 10,10 V34 H0 Z" fill="#2b2b2b"/>
<text x="14" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#e6e6e6">Windows PowerShell</text>
<g stroke="#bbbbbb" stroke-width="1.4" fill="none"><path d="M1166,17 h10"/><rect x="1200" y="12" width="10" height="10"/><path d="M1234,12 l10,10 M1244,12 l-10,10"/></g>
<rect x="118.7" y="70" width="320.0" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<rect x="213.5" y="230" width="35.6" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<rect x="213.5" y="270" width="43.5" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<rect x="63.4" y="330" width="98.8" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<g font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="13" fill="#cccccc">
<text x="18" y="63" textLength="1192.9" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PS C:\Users\estudiante-a\practica-u3&gt; $t = Get-Date; Test-NetConnection 127.0.0.1 -Port 5000; "Tardo {0:N1} segundos" -f ((Get-Date) - $t).TotalSeconds</text>
<text x="18" y="83" textLength="418.7" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">ADVERTENCIA: TCP connect to (127.0.0.1 : 5000) failed</text>
<text x="18" y="143" textLength="268.6" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">ComputerName           : 127.0.0.1</text>
<text x="18" y="163" textLength="268.6" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">RemoteAddress          : 127.0.0.1</text>
<text x="18" y="183" textLength="229.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">RemotePort             : 5000</text>
<text x="18" y="203" textLength="410.8" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">InterfaceAlias         : Loopback Pseudo-Interface 1</text>
<text x="18" y="223" textLength="268.6" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">SourceAddress          : 127.0.0.1</text>
<text x="18" y="243" textLength="229.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PingSucceeded          : True</text>
<text x="18" y="263" textLength="229.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PingReplyDetails (RTT) : 0 ms</text>
<text x="18" y="283" textLength="237.0" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">TcpTestSucceeded       : False</text>
<text x="18" y="343" textLength="142.2" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Tardo 7,3 segundos</text>
</g>
