<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 709 502" width="709" height="502" role="img" aria-labelledby="t d">
<title id="t">Windows PowerShell</title>
<desc id="d">Salida de ejemplo de la creación de la carpeta de práctica y de los tres archivos de ejemplo con dir</desc>
<rect width="709" height="502" rx="10" fill="#0c0c0c"/>
<path d="M0,10 a10,10 0 0 1 10,-10 H699 a10,10 0 0 1 10,10 V34 H0 Z" fill="#2b2b2b"/>
<text x="14" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#e6e6e6">Windows PowerShell</text>
<g stroke="#bbbbbb" stroke-width="1.4" fill="none"><path d="M613,17 h10"/><rect x="647" y="12" width="10" height="10"/><path d="M681,12 l10,10 M691,12 l-10,10"/></g>
<rect x="213.5" y="50" width="90.9" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<rect x="411.0" y="250" width="98.8" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<g font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="13" fill="#cccccc">
<text x="18" y="63" textLength="481.9" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PS C:\Users\estudiante-a\practica-u3&gt; mkdir $HOME\practica-u3</text>
<text x="18" y="103" textLength="292.3" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">    Directorio: C:\Users\estudiante-a</text>
<text x="18" y="143" textLength="426.6" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Mode                 LastWriteTime         Length Name</text>
<text x="18" y="163" textLength="426.6" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">----                 -------------         ------ ----</text>
<text x="18" y="183" textLength="505.6" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">d-----        09/11/2026   9:10 a. m.                practica-u3</text>
<text x="18" y="243" textLength="458.2" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PS C:\Users\estudiante-a\practica-u3&gt; cd $HOME\practica-u3</text>
<text x="18" y="263" textLength="639.9" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PS C:\Users\estudiante-a\practica-u3&gt; Set-Content lecturas.txt "temperatura=24.5"</text>
<text x="18" y="283" textLength="632.0" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PS C:\Users\estudiante-a\practica-u3&gt; Set-Content notas.txt "sensor del pasillo"</text>
<text x="18" y="303" textLength="576.7" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PS C:\Users\estudiante-a\practica-u3&gt; Set-Content sensores.csv "id,lugar"</text>
<text x="18" y="323" textLength="323.9" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PS C:\Users\estudiante-a\practica-u3&gt; dir</text>
<text x="18" y="363" textLength="387.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">    Directorio: C:\Users\estudiante-a\practica-u3</text>
<text x="18" y="403" textLength="426.6" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Mode                 LastWriteTime         Length Name</text>
<text x="18" y="423" textLength="426.6" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">----                 -------------         ------ ----</text>
<text x="18" y="443" textLength="513.5" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">-a----        09/11/2026   9:11 a. m.             18 lecturas.txt</text>
<text x="18" y="463" textLength="489.8" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">-a----        09/11/2026   9:11 a. m.             20 notas.txt</text>
<text x="18" y="483" textLength="513.5" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">-a----        09/11/2026   9:11 a. m.             10 sensores.csv</text>
</g>
