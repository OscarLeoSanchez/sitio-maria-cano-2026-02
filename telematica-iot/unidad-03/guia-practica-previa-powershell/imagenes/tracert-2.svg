<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 678 402" width="678" height="402" role="img" aria-labelledby="t d">
<title id="t">Windows PowerShell</title>
<desc id="d">Salida de ejemplo de tracert hacia el compañero con un solo salto y de otro tracert con filas de asteriscos y el mensaje de tiempo de espera agotado</desc>
<rect width="678" height="402" rx="10" fill="#0c0c0c"/>
<path d="M0,10 a10,10 0 0 1 10,-10 H668 a10,10 0 0 1 10,10 V34 H0 Z" fill="#2b2b2b"/>
<text x="14" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#e6e6e6">Windows PowerShell</text>
<g stroke="#bbbbbb" stroke-width="1.4" fill="none"><path d="M582,17 h10"/><rect x="616" y="12" width="10" height="10"/><path d="M650,12 l10,10 M660,12 l-10,10"/></g>
<rect x="268.8" y="130" width="106.7" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<rect x="79.2" y="310" width="154.1" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<g font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="13" fill="#cccccc">
<text x="18" y="63" textLength="592.5" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PS C:\Users\estudiante-a\practica-u3&gt; tracert -d -h 8 -w 1000 192.168.10.45</text>
<text x="18" y="103" textLength="474.0" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Traza a 192.168.10.45 sobre caminos de 8 saltos como máximo.</text>
<text x="18" y="143" textLength="355.5" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">  1    &lt;1 ms    &lt;1 ms    &lt;1 ms  192.168.10.45</text>
<text x="18" y="183" textLength="118.5" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Traza completa.</text>
<text x="18" y="223" textLength="584.6" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PS C:\Users\estudiante-a\practica-u3&gt; tracert -d -h 3 -w 1000 203.0.113.50</text>
<text x="18" y="263" textLength="466.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Traza a 203.0.113.50 sobre caminos de 3 saltos como máximo.</text>
<text x="18" y="303" textLength="347.6" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">  1    &lt;1 ms    &lt;1 ms    &lt;1 ms  192.168.10.1</text>
<text x="18" y="323" textLength="608.3" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">  2     *        *        *     Tiempo de espera agotado para esta solicitud.</text>
<text x="18" y="343" textLength="608.3" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">  3     *        *        *     Tiempo de espera agotado para esta solicitud.</text>
<text x="18" y="383" textLength="118.5" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Traza completa.</text>
</g>
<circle cx="385.5" cy="131.0" r="9.5" fill="#f2b33d" stroke="#0c0c0c" stroke-width="1.5"/>
<text x="385.5" y="135.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2a24">1</text>
