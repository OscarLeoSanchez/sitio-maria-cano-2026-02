project:
  type: website
  output-dir: docs
  # Sin .nojekyll, GitHub procesa el sitio con Jekyll y puede alterar la salida.
  # Va como recurso porque cada render recrea docs/ desde cero.
  resources:
    - .nojekyll

lang: es

website:
  title: "Clases María Cano 2026-02"
  description: "Material de clase de Ingeniería de Software. Fundación Universitaria María Cano."
  site-url: "https://oscarleosanchez.github.io/sitio-maria-cano-2026-02/"
  favicon: estilos/favicon.svg
  search:
    location: sidebar
    type: textbox
  # Sin navbar a proposito: cada estudiante entra por el enlace de su curso y
  # no debe ver los demas. La navegacion vive en la barra lateral de cada curso.
  sidebar:
    # Sin title: Quarto lo renderiza como enlace a la raiz del sitio, que es
    # justo la pagina donde aparecen todos los cursos.
    - id: telematica-iot
      style: docked
      background: light
      collapse-level: 2
      contents:
        - text: "Presentación del curso"
          href: telematica-iot/index.qmd
        - section: "Unidad 1. Fundamentos de telecomunicaciones y telemática"
          contents:
            - text: "Semana 1. Qué es la telemática"
              href: telematica-iot/semana-01/index.qmd
    - id: estructura-de-datos
      style: docked
      background: light
      collapse-level: 2
      contents:
        - text: "Presentación del curso"
          href: estructura-de-datos/index.qmd
        - section: "Unidad 1. Introducción a las estructuras de datos"
          contents:
            - text: "Introducción a la unidad"
              href: estructura-de-datos/unidad-01/index.qmd
            - text: "Tema 1. Generalidades de algoritmos"
              href: estructura-de-datos/unidad-01/tema-01-generalidades-algoritmos/index.qmd
            - text: "Tema 2. Paradigma de programación orientada a objetos"
              href: estructura-de-datos/unidad-01/tema-02-poo/index.qmd
            - text: "Tema 3. Recursividad e implementación"
              href: estructura-de-datos/unidad-01/tema-03-recursividad/index.qmd
            - text: "Tema 4. Estrategias de programación"
              href: estructura-de-datos/unidad-01/tema-04-estrategias/index.qmd
    - id: base-de-datos
      style: docked
      background: light
      collapse-level: 2
      contents:
        - text: "Presentación del curso"
          href: base-de-datos/index.qmd
        - section: "Unidad 1. Introducción a los sistemas de bases de datos"
          contents:
            - text: "Semana 1. Qué resuelve una base de datos"
              href: base-de-datos/semana-01/index.qmd
    - id: calidad-del-software
      style: docked
      background: light
      collapse-level: 2
      contents:
        - text: "Presentación del curso"
          href: calidad-del-software/index.qmd
        - section: "Unidad 1. Calidad del software y estándares de calidad"
          contents:
            - text: "Semana 1. Qué es la calidad y quién la define"
              href: calidad-del-software/semana-01/index.qmd
    - id: lenguajes-moviles
      style: docked
      background: light
      collapse-level: 2
      contents:
        - text: "Presentación del curso"
          href: lenguajes-moviles/index.qmd
        - section: "Unidad 1. Tecnologías en desarrollo de aplicaciones para dispositivos móviles"
          contents:
            - text: "Semana 1. El dispositivo y las tres formas de construir"
              href: lenguajes-moviles/semana-01/index.qmd
  page-footer:
    background: light
    left: "Oscar Leonel Sánchez Conde"

format:
  html:
    theme:
      - cosmo
      - estilos/estilo.scss
    # Anchos nominales de la grilla. Quarto los ajusta al espacio disponible,
    # asi que el cuerpo termina entre 875px y 930px segun la pantalla. El
    # centrado del bloque completo se hace en estilo.scss.
    grid:
      sidebar-width: 290px
      body-width: 780px
      margin-width: 270px
      gutter-width: 1.5rem
    toc: true
    toc-depth: 3
    toc-title: "En esta guía"
    number-sections: true
    number-depth: 2
    code-copy: true
    code-overflow: wrap
    fig-align: left
    link-external-newwindow: true
    smooth-scroll: true
    anchor-sections: true

execute:
  echo: false
  freeze: auto
