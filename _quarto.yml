project:
  type: website
  output-dir: docs
  # Sin .nojekyll, GitHub procesa el sitio con Jekyll y puede alterar la salida.
  # Va como recurso porque cada render recrea docs/ desde cero.
  resources:
    - .nojekyll
    # Taller en HTML estatico, se publica tal cual junto a la Actividad 4.
    - base-de-datos/actividad-04/taller-mer-a-sql.html
    # Presentacion de matrices, HTML autonomo enlazado desde el Tema 2 de la Unidad 2.
    - estructura-de-datos/unidad-02/tema-02-matrices/matrices-visual.html
    - estructura-de-datos/unidad-02/tema-02-matrices/actividad-filtros.html
    - estructura-de-datos/unidad-02/tema-02-matrices/explicacion-filtros.html
    # Presentaciones interactivas de Calidad del software (kit), HTML autonomo.
    - calidad-del-software/unidad-01/tema-01-que-es-calidad-quien-la-define/presentacion-interactiva.html
    - calidad-del-software/unidad-01/tema-02-calidad-proceso-producto-iso-25010/presentacion-interactiva.html
    - calidad-del-software/unidad-01/tema-03-importancia-costo-mundo-globalizado/presentacion-interactiva.html
    - calidad-del-software/unidad-02/presentacion-interactiva.html
    - calidad-del-software/unidad-03/presentacion-interactiva.html
    - calidad-del-software/unidad-04/presentacion-interactiva.html
    # Presentacion interactiva de Dart antes de Flutter (kit), HTML autonomo.
    - lenguajes-moviles/unidad-02/tema-02-dart-y-flutter/presentacion-interactiva.html

lang: es

