format:
  html:
    theme:
      - cosmo
      - estilos/estilo.scss
    # Anchos nominales de la grilla. Quarto los ajusta al espacio disponible,
    # asi que el cuerpo termina entre 875px y 930px segun la pantalla. El
    # centrado del bloque completo se hace en estilo.scss.
    grid:
      sidebar-width: 290px
      body-width: 780px
      margin-width: 270px
      gutter-width: 1.5rem
    toc: true
    toc-depth: 3
    toc-title: "En esta guía"
    number-sections: true
    number-depth: 2
    code-copy: true
    code-overflow: wrap
    fig-align: left
    link-external-newwindow: true
    smooth-scroll: true
    anchor-sections: true

execute:
  echo: false
  freeze: auto
