project:
  type: website
  output-dir: docs
  # Sin .nojekyll, GitHub procesa el sitio con Jekyll y puede alterar la salida.
  # Va como recurso porque cada render recrea docs/ desde cero.
  resources:
    - .nojekyll

lang: es

website:
  title: "Clases María Cano 2026-02"
  description: "Material de clase de Ingeniería de Software. Fundación Universitaria María Cano."
  site-url: "https://oscarleosanchez.github.io/sitio-maria-cano-2026-02/"
  favicon: estilos/favicon.svg
  search:
    location: sidebar
    type: textbox
  # Sin navbar a proposito: cada estudiante entra por el enlace de su curso y
  # no debe ver los demas. La navegacion vive en la barra lateral de cada curso.
  sidebar:
