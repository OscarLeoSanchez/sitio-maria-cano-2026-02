<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="300" viewBox="0 0 680 300" role="img" aria-label="Stack coloca a sus hijos en capas superpuestas, el primero de la lista queda atrás y el último queda adelante. Positioned fija la distancia de un hijo respecto a los bordes del Stack, por ejemplo right y bottom" xmlns="http://www.w3.org/2000/svg">
  <text x="170" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#17456f">Stack con un hijo Positioned</text>
  <rect x="35" y="45" width="260" height="190" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <rect x="45" y="55" width="240" height="170" fill="#eef3fb" stroke="#17456f" stroke-width="1.6"/>
  <text x="165" y="145" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">Image.network(...)</text>
  <rect x="225" y="170" width="50" height="40" fill="#ffe1ea" stroke="#9b2c5e" stroke-width="1.8"/>
  <text x="250" y="195" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#9b2c5e">Icon</text>
  <path d="M 275,190 L 293,190" stroke="#9b2c5e" stroke-width="1.3" stroke-dasharray="3 3"/>
  <text x="284" y="182" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9.5" fill="#9b2c5e">right: 8</text>
  <path d="M 250,210 L 250,233" stroke="#9b2c5e" stroke-width="1.3" stroke-dasharray="3 3"/>
  <text x="250" y="246" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9.5" fill="#9b2c5e">bottom: 8</text>
  <text x="165" y="268" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6876">el área punteada es el Stack completo</text>
  <text x="510" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#17456f">Orden de las capas</text>
  <rect x="380" y="60" width="110" height="110" fill="#eef3fb" stroke="#17456f" stroke-width="1.6"/>
  <rect x="405" y="85" width="110" height="110" fill="#d7f0ef" stroke="#0e8f8f" stroke-width="1.6"/>
  <rect x="430" y="110" width="110" height="110" fill="#ffe1ea" stroke="#9b2c5e" stroke-width="1.8"/>
  <rect x="560" y="70" width="14" height="14" fill="#eef3fb" stroke="#17456f" stroke-width="1.3"/>
  <text x="580" y="81" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#17456f">0: atrás</text>
  <rect x="560" y="96" width="14" height="14" fill="#d7f0ef" stroke="#0e8f8f" stroke-width="1.3"/>
  <text x="580" y="107" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#0e8f8f">1</text>
  <rect x="560" y="122" width="14" height="14" fill="#ffe1ea" stroke="#9b2c5e" stroke-width="1.3"/>
  <text x="580" y="133" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#9b2c5e">2: adelante</text>
  <text x="510" y="268" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6876">el último hijo de la lista se dibuja encima</text>
</svg>
