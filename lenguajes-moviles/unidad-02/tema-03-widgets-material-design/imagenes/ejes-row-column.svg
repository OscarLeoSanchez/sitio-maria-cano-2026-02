<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="340" viewBox="0 0 680 340" role="img" aria-label="Row organiza en horizontal con el eje principal a lo largo y el eje cruzado hacia abajo. Column organiza en vertical con el eje principal hacia abajo y el eje cruzado a lo largo. MainAxisAlignment mueve los hijos sobre el eje principal y CrossAxisAlignment sobre el eje cruzado" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="flechaEjes" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0e8f8f"/>
    </marker>
    <marker id="flechaCruzEjes" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9b2c5e"/>
    </marker>
  </defs>

  <line x1="340" y1="10" x2="340" y2="330" stroke="#dbe3ee" stroke-width="1.3"/>

  <text x="170" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#17456f">Row</text>

  <path d="M 30,50 L 300,50" stroke="#0e8f8f" stroke-width="1.8" fill="none" marker-end="url(#flechaEjes)"/>
  <text x="165" y="44" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#0e8f8f">eje principal: mainAxisAlignment</text>

  <path d="M 20,70 L 20,220" stroke="#9b2c5e" stroke-width="1.8" fill="none" marker-end="url(#flechaCruzEjes)"/>
  <text x="20" y="235" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.6" fill="#9b2c5e">eje cruzado:</text>
  <text x="20" y="248" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.6" fill="#9b2c5e">crossAxisAlignment</text>

  <rect x="40" y="70" width="270" height="130" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <rect x="55" y="120" width="46" height="46" fill="#eef3fb" stroke="#17456f" stroke-width="1.6"/>
  <rect x="147" y="105" width="46" height="76" fill="#eef3fb" stroke="#17456f" stroke-width="1.6"/>
  <rect x="239" y="120" width="46" height="46" fill="#eef3fb" stroke="#17456f" stroke-width="1.6"/>
  <text x="270" y="215" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#5b6876">spaceEvenly + stretch</text>

  <text x="170" y="270" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">acomoda a sus hijos en fila</text>
  <text x="170" y="288" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">de izquierda a derecha</text>

  <text x="510" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#17456f">Column</text>

  <path d="M 430,50 L 430,215" stroke="#0e8f8f" stroke-width="1.8" fill="none" marker-end="url(#flechaEjes)"/>
  <text x="415" y="130" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#0e8f8f" transform="rotate(-90 415 130)">eje principal: mainAxisAlignment</text>

  <path d="M 460,45 L 640,45" stroke="#9b2c5e" stroke-width="1.8" fill="none" marker-end="url(#flechaCruzEjes)"/>
  <text x="600" y="38" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.6" fill="#9b2c5e">eje cruzado: crossAxisAlignment</text>

  <rect x="460" y="55" width="150" height="160" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <rect x="475" y="65" width="120" height="34" fill="#eef3fb" stroke="#17456f" stroke-width="1.6"/>
  <rect x="475" y="119" width="70" height="34" fill="#eef3fb" stroke="#17456f" stroke-width="1.6"/>
  <rect x="475" y="173" width="120" height="34" fill="#eef3fb" stroke="#17456f" stroke-width="1.6"/>

  <text x="535" y="270" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">acomoda a sus hijos en columna</text>
  <text x="535" y="288" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">de arriba hacia abajo</text>

  <text x="340" y="322" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#94a3b8">el eje principal de Row es el eje cruzado de Column, y viceversa</text>
</svg>
