<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="260" viewBox="0 0 720 260" role="img" aria-label="Jerarquia de los tipos basicos de Dart: Object en la raiz, y de ahi num con int y double, String, bool, List, Set y Map" xmlns="http://www.w3.org/2000/svg">
  <g stroke="#dbe3ee" stroke-width="1.3" fill="none">
    <path d="M 360,58 L 90,100"/>
    <path d="M 360,58 L 210,100"/>
    <path d="M 360,58 L 320,100"/>
    <path d="M 360,58 L 430,100"/>
    <path d="M 360,58 L 545,100"/>
    <path d="M 360,58 L 655,100"/>
    <path d="M 100,140 L 65,180"/>
    <path d="M 100,140 L 140,180"/>
  </g>

  <rect x="315" y="16" width="90" height="38" rx="19" fill="#eef3fb" stroke="#17456f" stroke-width="1.8"/>
  <text x="360" y="41" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14" font-weight="700" fill="#17456f">Object</text>

  <g font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13">
    <rect x="55" y="100" width="90" height="38" rx="19" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="1.8"/>
    <text x="100" y="124" text-anchor="middle" fill="#0e8f8f" font-weight="700">num</text>

    <rect x="170" y="100" width="90" height="38" rx="19" fill="#fbecf2" stroke="#9b2c5e" stroke-width="1.8"/>
    <text x="215" y="124" text-anchor="middle" fill="#9b2c5e" font-weight="700">String</text>

    <rect x="280" y="100" width="90" height="38" rx="19" fill="#fdf3e7" stroke="#b8730f" stroke-width="1.8"/>
    <text x="325" y="124" text-anchor="middle" fill="#b8730f" font-weight="700">bool</text>

    <rect x="390" y="100" width="90" height="38" rx="19" fill="#eef3fb" stroke="#17456f" stroke-width="1.8"/>
    <text x="435" y="124" text-anchor="middle" fill="#17456f" font-weight="700">List&lt;E&gt;</text>

    <rect x="500" y="100" width="90" height="38" rx="19" fill="#eaf7ee" stroke="#237a3f" stroke-width="1.8"/>
    <text x="545" y="124" text-anchor="middle" fill="#237a3f" font-weight="700">Set&lt;E&gt;</text>

    <rect x="610" y="100" width="95" height="38" rx="19" fill="#fbecf2" stroke="#9b2c5e" stroke-width="1.8"/>
    <text x="657" y="124" text-anchor="middle" fill="#9b2c5e" font-weight="700">Map&lt;K,V&gt;</text>

    <rect x="20" y="180" width="70" height="36" rx="18" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="1.8"/>
    <text x="55" y="203" text-anchor="middle" fill="#0e8f8f" font-weight="700">int</text>

    <rect x="105" y="180" width="80" height="36" rx="18" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="1.8"/>
    <text x="145" y="203" text-anchor="middle" fill="#0e8f8f" font-weight="700">double</text>
  </g>

  <text x="360" y="248" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#94a3b8">Todo en Dart, hasta un numero, es un objeto: 5.hashCode es una llamada valida.</text>
</svg>
