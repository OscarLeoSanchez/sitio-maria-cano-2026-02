<?xml version="1.0" encoding="UTF-8"?>
<svg width="850" height="400" viewBox="0 0 850 400" role="img" aria-label="Modelo de compilacion de Flutter: una sola base de codigo Dart se compila con JIT para desarrollo con hot reload, o con AOT para produccion. El compilador AOT genera codigo nativo ARM o x64 para Android, iOS y escritorio, y JavaScript o WebAssembly para la Web" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="flechaComp" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <g stroke="#94a3b8" stroke-width="1.6" fill="none">
    <path d="M 330,80 L 220,150" marker-end="url(#flechaComp)"/>
    <path d="M 510,80 L 620,150" marker-end="url(#flechaComp)"/>
    <path d="M 210,220 L 210,270" marker-end="url(#flechaComp)"/>
    <path d="M 590,220 L 545,270" marker-end="url(#flechaComp)"/>
    <path d="M 670,220 L 715,270" marker-end="url(#flechaComp)"/>
  </g>

  <rect x="270" y="20" width="300" height="60" rx="8" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle" fill="#17456f">
    <text x="420" y="46" font-size="14.5" font-weight="700">una sola base de</text>
    <text x="420" y="66" font-size="14.5" font-weight="700">codigo fuente Dart</text>
  </g>

  <rect x="80" y="150" width="260" height="70" rx="8" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <text x="210" y="180" font-size="15.5" font-weight="700" fill="#0e8f8f">compilador JIT</text>
    <text x="210" y="203" font-size="12" fill="#0b6b6c">desarrollo, hot reload</text>
  </g>

  <rect x="500" y="150" width="260" height="70" rx="8" fill="#fdf6f9" stroke="#9b2c5e" stroke-width="2"/>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <text x="630" y="180" font-size="15.5" font-weight="700" fill="#9b2c5e">compilador AOT</text>
    <text x="630" y="203" font-size="12" fill="#8a2a4d">produccion</text>
  </g>

  <rect x="80" y="270" width="260" height="80" rx="8" fill="#f3f5f8" stroke="#5b6876" stroke-width="2"/>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle" fill="#5b6876">
    <text x="210" y="303" font-size="13" font-weight="700">corre en el dispositivo</text>
    <text x="210" y="322" font-size="13" font-weight="700">de prueba (modo debug)</text>
  </g>

  <rect x="445" y="270" width="180" height="90" rx="8" fill="#fdf6f9" stroke="#9b2c5e" stroke-width="2"/>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <text x="535" y="298" font-size="13.5" font-weight="700" fill="#9b2c5e">codigo nativo</text>
    <text x="535" y="316" font-size="13.5" font-weight="700" fill="#9b2c5e">ARM / x64</text>
    <text x="535" y="338" font-size="11.5" fill="#8a2a4d">Android, iOS, escritorio</text>
  </g>

  <rect x="635" y="270" width="180" height="90" rx="8" fill="#fdf6f9" stroke="#9b2c5e" stroke-width="2"/>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <text x="725" y="298" font-size="13.5" font-weight="700" fill="#9b2c5e">JavaScript /</text>
    <text x="725" y="316" font-size="13.5" font-weight="700" fill="#9b2c5e">WebAssembly</text>
    <text x="725" y="338" font-size="11.5" fill="#8a2a4d">Web</text>
  </g>
</svg>
