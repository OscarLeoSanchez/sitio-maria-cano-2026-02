<?xml version="1.0" encoding="UTF-8"?>
<svg width="860" height="260" viewBox="0 0 860 260" role="img" aria-label="Ciclo de vida de un StatefulWidget: createState crea el estado, initState se ejecuta una sola vez, build construye la pantalla y se repite cada vez que se llama a setState, y dispose se ejecuta al final para liberar recursos" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="flechaGris" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
    <marker id="flechaWine" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9b2c5e"/>
    </marker>
  </defs>

  <g stroke="#94a3b8" stroke-width="1.6" fill="none">
    <path d="M 194,160 L 230,160" marker-end="url(#flechaGris)"/>
    <path d="M 400,160 L 436,160" marker-end="url(#flechaGris)"/>
    <path d="M 606,160 L 642,160" marker-end="url(#flechaGris)"/>
  </g>

  <path d="M 580,118 C 590,60 452,60 462,118" stroke="#9b2c5e" stroke-width="1.6" fill="none" marker-end="url(#flechaWine)"/>
  <text x="521" y="26" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13" font-weight="700" fill="#9b2c5e">setState()</text>
  <text x="521" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6876">vuelve a llamar build()</text>

  <rect x="24" y="118" width="170" height="84" rx="8" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
  <rect x="230" y="118" width="170" height="84" rx="8" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
  <rect x="436" y="118" width="170" height="84" rx="8" fill="#fbecf2" stroke="#9b2c5e" stroke-width="2"/>
  <rect x="642" y="118" width="170" height="84" rx="8" fill="#f3f5f8" stroke="#5b6876" stroke-width="2"/>

  <g text-anchor="middle">
    <text x="109" y="148" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14" font-weight="700" fill="#17456f">createState()</text>
    <text x="109" y="168" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6876">Flutter crea el objeto</text>
    <text x="109" y="184" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6876">State asociado al widget</text>

    <text x="315" y="148" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14" font-weight="700" fill="#0e8f8f">initState()</text>
    <text x="315" y="168" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6876">se ejecuta una sola vez,</text>
    <text x="315" y="184" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6876">antes de mostrar el widget</text>

    <text x="521" y="148" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14" font-weight="700" fill="#9b2c5e">build()</text>
    <text x="521" y="168" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6876">construye el arbol de</text>
    <text x="521" y="184" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6876">widgets que se ve en pantalla</text>

    <text x="727" y="148" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14" font-weight="700" fill="#5b6876">dispose()</text>
    <text x="727" y="168" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6876">libera recursos al</text>
    <text x="727" y="184" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6876">destruir el widget</text>
  </g>

  <text x="430" y="232" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.3" fill="#94a3b8">initState se ejecuta una sola vez; build se repite cada vez que se llama a setState; dispose se ejecuta una unica vez al destruir el widget.</text>
</svg>
