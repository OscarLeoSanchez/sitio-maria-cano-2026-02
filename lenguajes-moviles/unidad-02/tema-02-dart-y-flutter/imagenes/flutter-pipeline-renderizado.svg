<?xml version="1.0" encoding="UTF-8"?>
<svg width="1070" height="210" viewBox="0 0 1070 210" role="img" aria-label="Pipeline de renderizado de Flutter en seis pasos: build arma el arbol de widgets, layout calcula tamanos y posiciones, paint genera instrucciones de dibujo, composite combina las capas en una escena, rasterize convierte la escena en pixeles, y el resultado llega como pixeles en pantalla. Este proceso se repite en cada frame" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="flechaPipeline" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <g stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#flechaPipeline)">
    <path d="M 162,81 L 191,81"/>
    <path d="M 341,81 L 370,81"/>
    <path d="M 520,81 L 549,81"/>
    <path d="M 699,81 L 728,81"/>
    <path d="M 878,81 L 907,81"/>
  </g>

  <rect x="15" y="46" width="145" height="70" rx="8" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
  <rect x="194" y="46" width="145" height="70" rx="8" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
  <rect x="373" y="46" width="145" height="70" rx="8" fill="#fbecf2" stroke="#9b2c5e" stroke-width="2"/>
  <rect x="552" y="46" width="145" height="70" rx="8" fill="#eaf7ee" stroke="#237a3f" stroke-width="2"/>
  <rect x="731" y="46" width="145" height="70" rx="8" fill="#fdf3e7" stroke="#b8730f" stroke-width="2"/>
  <rect x="910" y="46" width="145" height="70" rx="8" fill="#5b6876" stroke="#5b6876" stroke-width="2"/>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">
    <text x="87.5" y="86" fill="#17456f">build</text>
    <text x="266.5" y="86" fill="#0e8f8f">layout</text>
    <text x="445.5" y="86" fill="#9b2c5e">paint</text>
    <text x="624.5" y="86" fill="#237a3f">composite</text>
    <text x="803.5" y="86" fill="#b8730f">rasterize</text>
    <text x="982.5" y="76" fill="#ffffff">pixeles en</text>
    <text x="982.5" y="96" fill="#ffffff">pantalla</text>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#5b6876" text-anchor="middle">
    <text x="87.5" y="138">arma el arbol</text>
    <text x="87.5" y="154">de widgets</text>

    <text x="266.5" y="138">calcula tamanos</text>
    <text x="266.5" y="154">y posiciones</text>

    <text x="445.5" y="138">genera instrucciones</text>
    <text x="445.5" y="154">de dibujo</text>

    <text x="624.5" y="138">combina las capas</text>
    <text x="624.5" y="154">en una escena</text>

    <text x="803.5" y="138">convierte la escena</text>
    <text x="803.5" y="154">en pixeles</text>

    <text x="982.5" y="138">el usuario ve</text>
    <text x="982.5" y="154">el resultado final</text>
  </g>

  <text x="535" y="188" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#94a3b8">este proceso se repite en cada frame, hasta 60 veces por segundo</text>
</svg>
