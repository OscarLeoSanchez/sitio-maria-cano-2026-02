<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="390" viewBox="0 0 720 390" role="img" aria-label="Comparacion entre var, final y const en Dart: var permite que el valor cambie, final se asigna una sola vez al ejecutar el programa, const se asigna una sola vez antes de ejecutar el programa" xmlns="http://www.w3.org/2000/svg">
  <rect x="140" y="20" width="440" height="44" rx="8" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
  <rect x="140" y="150" width="440" height="44" rx="8" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
  <rect x="140" y="280" width="440" height="44" rx="8" fill="#fbecf2" stroke="#9b2c5e" stroke-width="2"/>

  <g font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="21">
    <text x="164" y="49" fill="#17456f" font-weight="700">var</text>
    <text x="202" y="49" fill="#334155"> nombre = "Ana";</text>

    <text x="164" y="179" fill="#0e8f8f" font-weight="700">final</text>
    <text x="227" y="179" fill="#334155"> hora = DateTime.now();</text>

    <text x="164" y="309" fill="#9b2c5e" font-weight="700">const</text>
    <text x="227" y="309" fill="#334155"> pi = 3.1416;</text>
  </g>

  <g stroke-width="2.5" fill="none">
    <path d="M 164,76 L 202,76" stroke="#17456f"/>
    <path d="M 164,206 L 227,206" stroke="#0e8f8f"/>
    <path d="M 164,336 L 227,336" stroke="#9b2c5e"/>
  </g>
  <g stroke-width="1.2" fill="none" stroke-dasharray="3 3">
    <path d="M 183,78 L 183,90" stroke="#17456f"/>
    <path d="M 195,208 L 195,220" stroke="#0e8f8f"/>
    <path d="M 195,338 L 195,350" stroke="#9b2c5e"/>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="600">
    <text x="183" y="105" fill="#17456f">el valor puede cambiar</text>
    <text x="195" y="235" fill="#0e8f8f">se fija en tiempo de ejecucion</text>
    <text x="195" y="365" fill="#9b2c5e">se fija en tiempo de compilacion</text>
  </g>
</svg>
