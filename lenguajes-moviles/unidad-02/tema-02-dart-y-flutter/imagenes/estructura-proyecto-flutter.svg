<?xml version="1.0" encoding="UTF-8"?>
<svg width="560" height="360" viewBox="0 0 560 360" role="img" aria-label="Estructura de carpetas que genera flutter create: lib con main.dart, una carpeta por plataforma nativa, test, y los archivos pubspec.yaml, analysis_options.yaml, metadata y gitignore. dart_tool y build se generan solos y no se versionan" xmlns="http://www.w3.org/2000/svg">
  <rect x="10" y="10" width="540" height="300" rx="8" fill="#fdf6f9" stroke="#9b2c5e" stroke-width="2"/>

  <g stroke="#dbe3ee" stroke-width="1.3" fill="none">
    <path d="M 38,52 L 38,290"/>
    <path d="M 38,60 L 54,60"/>
    <path d="M 38,125 L 54,125"/>
    <path d="M 38,175 L 54,175"/>
    <path d="M 38,225 L 54,225"/>
    <path d="M 38,255 L 54,255"/>
    <path d="M 38,285 L 54,285"/>
    <path d="M 60,60 L 60,85 L 76,85"/>
    <path d="M 60,175 L 60,200 L 76,200"/>
  </g>

  <g font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14.5">
    <text x="30" y="35" font-weight="700" fill="#17456f">hola_iue/</text>

    <text x="54" y="65" font-weight="700" fill="#17456f">lib/</text>
    <text x="76" y="90" fill="#9b2c5e" font-weight="700">main.dart</text>

    <text x="54" y="105" fill="#5b6876">android/  ios/  web/</text>
    <text x="54" y="122" fill="#5b6876">linux/  macos/  windows/</text>

    <text x="54" y="180" font-weight="700" fill="#17456f">test/</text>
    <text x="76" y="205" fill="#5b6876">widget_test.dart</text>

    <text x="54" y="230" fill="#0e8f8f">pubspec.yaml</text>
    <text x="54" y="260" fill="#5b6876">analysis_options.yaml</text>
    <text x="54" y="290" fill="#5b6876">.metadata  .gitignore</text>
  </g>

  <text x="105" y="140" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-style="italic" fill="#94a3b8">una carpeta nativa por plataforma</text>

  <text x="280" y="335" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#94a3b8">.dart_tool/ y build/ se generan solos al compilar: no se versionan</text>
</svg>
