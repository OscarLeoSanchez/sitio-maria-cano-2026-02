<?xml version="1.0" encoding="UTF-8"?>
<svg width="520" height="390" viewBox="0 0 520 390" role="img" aria-label="Tres formas de declarar parametros en Dart: posicionales entre parentesis normales, nombrados entre llaves y opcionales posicionales entre corchetes" xmlns="http://www.w3.org/2000/svg">
  <rect x="20" y="20" width="480" height="44" rx="8" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
  <rect x="20" y="150" width="480" height="44" rx="8" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
  <rect x="20" y="280" width="480" height="44" rx="8" fill="#fbecf2" stroke="#9b2c5e" stroke-width="2"/>

  <g font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="18">
    <text x="40" y="49" fill="#334155">int sumar</text>
    <text x="138" y="49" fill="#17456f" font-weight="700">(int a, int b)</text>

    <text x="40" y="179" fill="#334155">void saludo(</text>
    <text x="172" y="179" fill="#0e8f8f" font-weight="700">{String? nombre}</text>
    <text x="352" y="179" fill="#334155">)</text>

    <text x="40" y="309" fill="#334155">String unir(String a, </text>
    <text x="297" y="309" fill="#9b2c5e" font-weight="700">[String b]</text>
    <text x="405" y="309" fill="#334155">)</text>
  </g>

  <g stroke-width="2.2" fill="none">
    <path d="M 138,76 L 260,76" stroke="#17456f"/>
    <path d="M 172,206 L 350,206" stroke="#0e8f8f"/>
    <path d="M 297,336 L 403,336" stroke="#9b2c5e"/>
  </g>
  <g stroke-width="1.1" fill="none" stroke-dasharray="3 3">
    <path d="M 199,78 L 199,90" stroke="#17456f"/>
    <path d="M 261,208 L 261,220" stroke="#0e8f8f"/>
    <path d="M 350,338 L 350,350" stroke="#9b2c5e"/>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="600">
    <text x="199" y="105" fill="#17456f">obligatorios, van en orden</text>
    <text x="261" y="235" fill="#0e8f8f">por nombre, cualquier orden</text>
    <text x="350" y="365" fill="#9b2c5e">en orden, se pueden omitir</text>
  </g>
</svg>
