<?xml version="1.0" encoding="UTF-8"?>
<svg width="560" height="340" viewBox="0 0 560 340" role="img" aria-label="Estructura de carpetas que genera dart create: carpetas bin, lib y test, mas los archivos pubspec.yaml, analysis_options.yaml, gitignore, CHANGELOG y README" xmlns="http://www.w3.org/2000/svg">
  <rect x="10" y="10" width="540" height="320" rx="8" fill="#f5f8fd" stroke="#17456f" stroke-width="2"/>

  <g stroke="#dbe3ee" stroke-width="1.3" fill="none">
    <path d="M 38,52 L 38,300"/>
    <path d="M 38,60 L 54,60"/>
    <path d="M 38,110 L 54,110"/>
    <path d="M 38,160 L 54,160"/>
    <path d="M 38,200 L 54,200"/>
    <path d="M 38,230 L 54,230"/>
    <path d="M 38,260 L 54,260"/>
    <path d="M 38,290 L 54,290"/>
    <path d="M 60,60 L 60,85 L 76,85"/>
    <path d="M 60,110 L 60,135 L 76,135"/>
    <path d="M 60,160 L 60,185 L 76,185"/>
  </g>

  <g font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14.5">
    <text x="30" y="35" font-weight="700" fill="#17456f">hola_dart/</text>

    <text x="54" y="65" font-weight="700" fill="#17456f">bin/</text>
    <text x="76" y="90" fill="#5b6876">hola_dart.dart</text>

    <text x="54" y="115" font-weight="700" fill="#17456f">lib/</text>
    <text x="76" y="140" fill="#5b6876">hola_dart.dart</text>

    <text x="54" y="165" font-weight="700" fill="#17456f">test/</text>
    <text x="76" y="190" fill="#5b6876">hola_dart_test.dart</text>

    <text x="54" y="205" fill="#5b6876">.gitignore</text>
    <text x="54" y="235" fill="#0e8f8f">analysis_options.yaml</text>
    <text x="54" y="265" fill="#5b6876">CHANGELOG.md</text>
    <text x="54" y="295" fill="#0e8f8f">pubspec.yaml</text>
    <text x="230" y="295" fill="#5b6876">README.md</text>
  </g>

  <text x="280" y="325" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#94a3b8">bin/ se ejecuta. lib/ se reutiliza. test/ se verifica.</text>
</svg>
