<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="470" viewBox="0 0 720 470" role="img" aria-label="Flujo completo de la pantalla del catálogo: initState llama a cargar, cargar pone el estado cargando, pide los productos y el clima, calcula el clima del día y los productos sugeridos, y termina en listo o vacío; si algo falla, termina en error y el botón Reintentar vuelve a llamar a cargar" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="a-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#17456f"/></marker><marker id="a-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2e7d5b"/></marker><marker id="a-grey" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5b6876"/></marker><marker id="a-red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a32d22"/></marker></defs>
<text x="360.0" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#17456f">Flujo completo de CatalogoScreen</text>
<rect x="20" y="50" width="200" height="50" rx="10" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
<text x="120.0" y="79.76" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#17456f">initState llama a cargar()</text>
<rect x="260" y="50" width="200" height="50" rx="10" fill="#fff4e5" stroke="#b45309" stroke-width="2"/>
<text x="360.0" y="79.76" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#17456f">estado = cargando</text>
<rect x="500" y="50" width="200" height="50" rx="10" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
<text x="600.0" y="71.37" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">await pedirProductos()</text>
<text x="600.0" y="87.87" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">(simulado, 2 s)</text>
<path d="M 222,75 L 258,75" stroke="#5b6876" stroke-width="1.8" fill="none" marker-end="url(#a-grey)"/>
<path d="M 462,75 L 498,75" stroke="#5b6876" stroke-width="1.8" fill="none" marker-end="url(#a-grey)"/>
<path d="M 600,102 L 600,135" stroke="#5b6876" stroke-width="1.8" fill="none" marker-end="url(#a-grey)"/>
<rect x="500" y="137" width="200" height="50" rx="10" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
<text x="600.0" y="158.37" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">await pedirClima()</text>
<text x="600.0" y="174.87" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">(real, máximo 5 s)</text>
<path d="M 498,162 L 462,162" stroke="#5b6876" stroke-width="1.8" fill="none" marker-end="url(#a-grey)"/>
<rect x="260" y="137" width="200" height="50" rx="10" fill="#f6eefb" stroke="#7a3ea1" stroke-width="2"/>
<text x="360.0" y="158.48" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#17456f">climaDelDia(lluvia)</text>
<text x="360.0" y="174.48" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#17456f">sugeridos(productos, clima)</text>
<path d="M 360,189 L 360,232" stroke="#5b6876" stroke-width="1.8" fill="none" marker-end="url(#a-grey)"/>
<rect x="260" y="234" width="200" height="50" rx="10" fill="#f3f5f7" stroke="#5b6876" stroke-width="2"/>
<text x="360.0" y="255.37" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">¿la lista de sugeridos</text>
<text x="360.0" y="271.87" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">tiene elementos?</text>
<path d="M 262,259 L 160,259 L 160,300" stroke="#2e7d5b" stroke-width="1.8" fill="none" marker-end="url(#a-green)"/>
<path d="M 458,259 L 560,259 L 560,300" stroke="#17456f" stroke-width="1.8" fill="none" marker-end="url(#a-blue)"/>
<text x="205" y="250" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#2e7d5b">sí</text>
<text x="515" y="250" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#17456f">no</text>
<rect x="60" y="302" width="200" height="50" rx="10" fill="#f4faf7" stroke="#2e7d5b" stroke-width="2"/>
<text x="160.0" y="323.37" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">estado = listo</text>
<text x="160.0" y="339.87" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">clima + lista de sugeridos</text>
<rect x="460" y="302" width="200" height="50" rx="10" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
<text x="560.0" y="323.37" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">estado = vacío</text>
<text x="560.0" y="339.87" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">aviso: nada que mostrar</text>
<rect x="260" y="392" width="200" height="56" rx="10" fill="#fdf3f2" stroke="#a32d22" stroke-width="2"/>
<text x="360.0" y="416.37" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">estado = error</text>
<text x="360.0" y="432.87" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">mensaje + botón Reintentar</text>
<path d="M 600,189 L 712,189 L 712,420 L 462,420" stroke="#a32d22" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#a-red)"/>
<text x="580" y="410" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#a32d22">TimeoutException, SocketException</text>
<path d="M 258,420 L 8,420 L 8,75 L 18,75" stroke="#5b6876" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#a-grey)"/>
<text x="140" y="440" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">Reintentar: vuelve a cargar()</text>
</svg>
