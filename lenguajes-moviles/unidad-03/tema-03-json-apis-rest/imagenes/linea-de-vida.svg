<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="Línea de vida de un State: initState corre una vez al nacer, build corre cada vez que hay un cambio, y dispose corre una vez al morir. mounted es verdadero entre initState y dispose" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="a-grey" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5b6876"/></marker></defs>
<text x="360.0" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#17456f">La línea de vida de una pantalla con estado</text>
<path d="M 30,100 L 690,100" stroke="#5b6876" stroke-width="3" fill="none" marker-end="url(#a-grey)"/>
<text x="690" y="86" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5b6876">tiempo</text>
<rect x="40" y="70" width="14" height="60" rx="4" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
<rect x="200" y="70" width="14" height="60" rx="4" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
<rect x="310" y="70" width="14" height="60" rx="4" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
<rect x="420" y="70" width="14" height="60" rx="4" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
<rect x="600" y="70" width="14" height="60" rx="4" fill="#fbecf2" stroke="#9b2c5e" stroke-width="2"/>
<text x="47" y="58" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13" font-weight="700" fill="#17456f">initState</text>
<text x="317" y="58" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13" font-weight="700" fill="#0e8f8f">build  (una vez por cada setState)</text>
<text x="607" y="58" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13" font-weight="700" fill="#9b2c5e">dispose</text>
<path d="M 47,150 L 607,150" stroke="#7a3ea1" stroke-width="2" fill="none"/>
<path d="M 47,144 L 47,156" stroke="#7a3ea1" stroke-width="2" fill="none"/>
<path d="M 607,144 L 607,156" stroke="#7a3ea1" stroke-width="2" fill="none"/>
<text x="327" y="174" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#7a3ea1">mounted == true: la pantalla existe, setState es seguro</text>
<rect x="20" y="205" width="200" height="100" rx="10" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
<text x="120.0" y="234.87" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#17456f">initState</text>
<text x="120.0" y="251.37" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">Corre una sola vez</text>
<text x="120.0" y="267.87" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">al nacer.</text>
<text x="120.0" y="284.37" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">Aquí llamas cargar().</text>
<rect x="260" y="205" width="200" height="100" rx="10" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
<text x="360.0" y="234.87" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#0e8f8f">build</text>
<text x="360.0" y="251.37" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">Corre muchas veces.</text>
<text x="360.0" y="267.87" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">Solo dibuja: sin pedir</text>
<text x="360.0" y="284.37" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">datos ni trabajo pesado.</text>
<rect x="500" y="205" width="200" height="100" rx="10" fill="#fbecf2" stroke="#9b2c5e" stroke-width="2"/>
<text x="600.0" y="234.87" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#9b2c5e">dispose</text>
<text x="600.0" y="251.37" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">Corre una sola vez</text>
<text x="600.0" y="267.87" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">al morir. Aquí cancelas</text>
<text x="600.0" y="284.37" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">lo que abriste.</text>
</svg>
