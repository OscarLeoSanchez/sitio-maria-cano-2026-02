<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="El celular envía una petición por internet al servidor y espera; el servidor devuelve una respuesta con un código de estado y un cuerpo JSON. Mientras espera, la app sigue dibujando" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="a-grey" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5b6876"/></marker><marker id="a-purple" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7a3ea1"/></marker><marker id="a-teal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0e8f8f"/></marker></defs>
<text x="360.0" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#17456f">El viaje de una petición</text>
<rect x="30" y="60" width="190" height="120" rx="10" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
<text x="125.0" y="107.76" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#17456f">Celular</text>
<text x="125.0" y="124.76" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#17456f">Tu app Flutter</text>
<text x="125.0" y="141.76" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#17456f">(el cliente)</text>
<rect x="500" y="60" width="190" height="120" rx="10" fill="#f4faf7" stroke="#2e7d5b" stroke-width="2"/>
<text x="595.0" y="107.76" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#2e7d5b">Servidor</text>
<text x="595.0" y="124.76" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#17456f">api.open-meteo.com</text>
<text x="595.0" y="141.76" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#17456f">(el servidor)</text>
<path d="M 222,95 L 498,95" stroke="#0e8f8f" stroke-width="2.2" fill="none" marker-end="url(#a-teal)"/>
<text x="360" y="85" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0e8f8f">1. Petición: GET + URL</text>
<path d="M 498,150 L 222,150" stroke="#7a3ea1" stroke-width="2.2" fill="none" marker-end="url(#a-purple)"/>
<text x="360" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#7a3ea1">2. Respuesta: 200 + JSON</text>
<text x="360" y="122" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5b6876">viaja por internet</text>
<text x="360" y="138" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5b6876">tarda: no es instantáneo</text>
<path d="M 30,217 L 688,217" stroke="#5b6876" stroke-width="2.5" fill="none" marker-end="url(#a-grey)"/>
<path d="M 30,205 L 30,230" stroke="#5b6876" stroke-width="1.5" fill="none"/>
<path d="M 690,205 L 690,230" stroke="#5b6876" stroke-width="1.5" fill="none"/>
<text x="360" y="252" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#b45309">tiempo de espera: de unos 100 ms a varios segundos, o nunca si no hay red</text>
<text x="360" y="278" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">Mientras tanto la app sigue viva: dibuja, responde a toques y muestra un indicador de carga.</text>
<text x="360" y="300" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">Por eso el código tiene que esperar la respuesta sin congelar la pantalla (Parte 4).</text>
</svg>
