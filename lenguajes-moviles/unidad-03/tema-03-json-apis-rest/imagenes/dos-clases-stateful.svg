<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="Un StatefulWidget son dos clases: el StatefulWidget, que es el marco fijo, y su State, donde viven las variables que cambian y el método build" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="a-grey" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5b6876"/></marker></defs>
<text x="360.0" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#17456f">Un StatefulWidget son dos clases</text>
<rect x="30" y="55" width="280" height="150" rx="10" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
<text x="170.0" y="101.62" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#17456f">class Contador extends StatefulWidget</text>
<text x="170.0" y="118.12" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">Es el marco: descripción fija</text>
<text x="170.0" y="134.62" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">Sus campos son final</text>
<text x="170.0" y="151.12" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">Solo sabe crear su State</text>
<text x="170.0" y="167.62" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">createState() =&gt; _ContadorState()</text>
<rect x="410" y="55" width="280" height="150" rx="10" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
<text x="550.0" y="101.62" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0e8f8f">class _ContadorState extends State</text>
<text x="550.0" y="118.12" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">Guarda las variables: int cuenta = 0</text>
<text x="550.0" y="134.62" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">Tiene initState, build y dispose</text>
<text x="550.0" y="151.12" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">Persiste mientras la pantalla viva</text>
<text x="550.0" y="167.62" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">setState() vive aquí</text>
<path d="M 312,130 L 408,130" stroke="#5b6876" stroke-width="2" fill="none" marker-end="url(#a-grey)"/>
<text x="360" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">crea</text>
<text x="170" y="228" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">se puede volver a crear</text>
<text x="550" y="228" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">se conserva entre reconstrucciones</text>
<rect x="30" y="250" width="660" height="58" rx="8" fill="#fff4e5" stroke="#b45309" stroke-width="1.5"/>
<text x="360" y="274" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#b45309">Analogía: la pizarra de un restaurante. El marco es la pizarra (siempre la misma).</text>
<text x="360" y="294" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#b45309">Lo escrito en ella es el State: lo borras y lo reescribes sin cambiar la pizarra.</text>
</svg>
