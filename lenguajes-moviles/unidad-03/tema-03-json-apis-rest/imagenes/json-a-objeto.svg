<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="320" viewBox="0 0 720 320" role="img" aria-label="De texto JSON a objeto Dart: jsonDecode convierte el texto en un Map, y Producto.fromJson convierte el Map en un objeto Producto" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="a-grey" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5b6876"/></marker></defs>
<text x="360.0" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#17456f">Del texto JSON a un objeto de Dart</text>
<rect x="20" y="55" width="195" height="150" rx="10" fill="#fff4e5" stroke="#b45309" stroke-width="2"/>
<text x="117.5" y="97.32" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#b45309">Texto (String)</text>
<text x="117.5" y="116.32" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#b45309">{"id": 4,</text>
<text x="117.5" y="135.32" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#b45309"> "nombre": "Panela",</text>
<text x="117.5" y="154.32" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#b45309"> "precio": 5500,</text>
<text x="117.5" y="173.32" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#b45309"> "disponible": true}</text>
<rect x="262" y="55" width="195" height="150" rx="10" fill="#f6eefb" stroke="#7a3ea1" stroke-width="2"/>
<text x="359.5" y="97.32" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#7a3ea1">Map&lt;String, dynamic&gt;</text>
<text x="359.5" y="116.32" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#7a3ea1">'id': 4</text>
<text x="359.5" y="135.32" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#7a3ea1">'nombre': 'Panela'</text>
<text x="359.5" y="154.32" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#7a3ea1">'precio': 5500</text>
<text x="359.5" y="173.32" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#7a3ea1">'disponible': true</text>
<rect x="505" y="55" width="195" height="150" rx="10" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
<text x="602.5" y="97.32" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#0e8f8f">Producto</text>
<text x="602.5" y="116.32" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#0e8f8f">id: 4</text>
<text x="602.5" y="135.32" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#0e8f8f">nombre: Panela</text>
<text x="602.5" y="154.32" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#0e8f8f">precio: 5500</text>
<text x="602.5" y="173.32" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#0e8f8f">disponible: true</text>
<path d="M 217,130 L 260,130" stroke="#5b6876" stroke-width="2" fill="none" marker-end="url(#a-grey)"/>
<path d="M 459,130 L 503,130" stroke="#5b6876" stroke-width="2" fill="none" marker-end="url(#a-grey)"/>
<text x="117" y="228" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12.5" font-weight="700" fill="#7a3ea1">jsonDecode</text>
<text x="360" y="228" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12.5" font-weight="700" fill="#0e8f8f">Producto.fromJson</text>
<text x="117" y="247" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5b6876">lee el texto</text>
<text x="360" y="247" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5b6876">tú copias cada clave</text>
<text x="602" y="228" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5b6876">lo que usas en la UI</text>
<text x="360" y="285" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">Un Map se consulta con corchetes: json['nombre']. Un objeto, con punto: producto.nombre.</text>
</svg>
