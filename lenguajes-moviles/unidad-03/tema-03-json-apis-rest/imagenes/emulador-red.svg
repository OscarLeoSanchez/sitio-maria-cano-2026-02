<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="En el emulador de Android, localhost es el propio emulador, no tu computador. Para llegar al computador se usa 10.0.2.2" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="a-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2e7d5b"/></marker></defs>
<text x="360.0" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#17456f">localhost frente a 10.0.2.2 en el emulador</text>
<rect x="20" y="50" width="680" height="235" rx="14" fill="#f3f5f7" stroke="#5b6876" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="40" y="72" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#5b6876">Tu computador</text>
<rect x="40" y="90" width="250" height="180" rx="10" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
<text x="165" y="112" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#17456f">Emulador de Android</text>
<rect x="55" y="125" width="220" height="44" rx="10" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
<text x="165.0" y="151.9" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#17456f">Tu app Flutter</text>
<rect x="55" y="182" width="220" height="76" rx="10" fill="#fdf3f2" stroke="#a32d22" stroke-width="2"/>
<text x="165.0" y="208.12" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">localhost es el propio emulador:</text>
<text x="165.0" y="224.62" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">ahí no hay ningún servidor</text>
<text x="165.0" y="241.12" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">Connection refused</text>
<rect x="500" y="125" width="180" height="100" rx="10" fill="#f4faf7" stroke="#2e7d5b" stroke-width="2"/>
<text x="590.0" y="163.48" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#2e7d5b">Servidor local</text>
<text x="590.0" y="179.48" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#17456f">python -m http.server 8000</text>
<text x="590.0" y="195.48" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#17456f">tu servidor de desarrollo</text>
<path d="M 277,147 L 498,147" stroke="#2e7d5b" stroke-width="2.2" fill="none" marker-end="url(#a-green)"/>
<text x="388" y="137" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12" font-weight="700" fill="#2e7d5b">http://10.0.2.2:8000</text>
<text x="388" y="168" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5b6876">10.0.2.2 es tu computador</text>
<text x="360" y="312" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">En un celular físico no existe 10.0.2.2: usas la IP de tu computador en la red local.</text>
</svg>
