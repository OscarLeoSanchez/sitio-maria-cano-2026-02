<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="Cuatro cosas que pueden fallar al pedir datos y cómo se ve cada una en el código: sin red lanza SocketException, demasiado tiempo lanza TimeoutException, un código distinto de 200 no lanza excepción, y un JSON inesperado lanza FormatException o TypeError" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="a-grey" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5b6876"/></marker></defs>
<text x="360.0" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#17456f">Cuatro cosas que pueden fallar</text>
<text x="120" y="58" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#5b6876">Qué pasó</text>
<text x="380" y="58" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#5b6876">Qué ves en el código</text>
<text x="610" y="58" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#5b6876">Qué le dices a la persona</text>
<rect x="20" y="70" width="200" height="56" rx="10" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
<text x="120.0" y="102.76" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#17456f">No hay red</text>
<rect x="240" y="70" width="280" height="56" rx="10" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
<text x="380.0" y="102.76" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#17456f">SocketException</text>
<rect x="540" y="70" width="160" height="56" rx="10" fill="#f3f5f7" stroke="#5b6876" stroke-width="2"/>
<text x="620.0" y="102.48" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#17456f">No hay conexión a internet.</text>
<path d="M 222,98 L 238,98" stroke="#5b6876" stroke-width="1.6" fill="none" marker-end="url(#a-grey)"/>
<path d="M 522,98 L 538,98" stroke="#5b6876" stroke-width="1.6" fill="none" marker-end="url(#a-grey)"/>
<rect x="20" y="138" width="200" height="56" rx="10" fill="#fff4e5" stroke="#b45309" stroke-width="2"/>
<text x="120.0" y="170.76" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#17456f">Tarda demasiado</text>
<rect x="240" y="138" width="280" height="56" rx="10" fill="#fff4e5" stroke="#b45309" stroke-width="2"/>
<text x="380.0" y="170.76" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#17456f">TimeoutException</text>
<rect x="540" y="138" width="160" height="56" rx="10" fill="#f3f5f7" stroke="#5b6876" stroke-width="2"/>
<text x="620.0" y="170.48" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#17456f">La respuesta tardó demasiado.</text>
<path d="M 222,166 L 238,166" stroke="#5b6876" stroke-width="1.6" fill="none" marker-end="url(#a-grey)"/>
<path d="M 522,166 L 538,166" stroke="#5b6876" stroke-width="1.6" fill="none" marker-end="url(#a-grey)"/>
<rect x="20" y="206" width="200" height="56" rx="10" fill="#fbecf2" stroke="#9b2c5e" stroke-width="2"/>
<text x="120.0" y="238.76" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#17456f">El servidor responde 404 o 500</text>
<rect x="240" y="206" width="280" height="56" rx="10" fill="#fbecf2" stroke="#9b2c5e" stroke-width="2"/>
<text x="380.0" y="238.76" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#17456f">statusCode != 200 (sin excepción)</text>
<rect x="540" y="206" width="160" height="56" rx="10" fill="#f3f5f7" stroke="#5b6876" stroke-width="2"/>
<text x="620.0" y="238.48" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#17456f">Algo salió mal.</text>
<path d="M 222,234 L 238,234" stroke="#5b6876" stroke-width="1.6" fill="none" marker-end="url(#a-grey)"/>
<path d="M 522,234 L 538,234" stroke="#5b6876" stroke-width="1.6" fill="none" marker-end="url(#a-grey)"/>
<rect x="20" y="274" width="200" height="56" rx="10" fill="#f6eefb" stroke="#7a3ea1" stroke-width="2"/>
<text x="120.0" y="306.76" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#17456f">Llega algo que no esperabas</text>
<rect x="240" y="274" width="280" height="56" rx="10" fill="#f6eefb" stroke="#7a3ea1" stroke-width="2"/>
<text x="380.0" y="306.76" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#17456f">FormatException o TypeError</text>
<rect x="540" y="274" width="160" height="56" rx="10" fill="#f3f5f7" stroke="#5b6876" stroke-width="2"/>
<text x="620.0" y="306.48" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#17456f">Algo salió mal.</text>
<path d="M 222,302 L 238,302" stroke="#5b6876" stroke-width="1.6" fill="none" marker-end="url(#a-grey)"/>
<path d="M 522,302 L 538,302" stroke="#5b6876" stroke-width="1.6" fill="none" marker-end="url(#a-grey)"/>
<text x="360" y="350" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">Dos mensajes distintos alcanzan: lo técnico va a la consola, lo claro va a la pantalla.</text>
</svg>
