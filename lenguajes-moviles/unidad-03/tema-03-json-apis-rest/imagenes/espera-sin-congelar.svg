<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="Con await el código espera la respuesta, pero la app sigue dibujando. Cuando llega la respuesta, el código continúa en la línea siguiente" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="a-grey" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5b6876"/></marker></defs>
<text x="360.0" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#17456f">await espera la respuesta sin congelar la app</text>
<text x="30" y="66" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#17456f">La app (dibuja y atiende toques)</text>
<rect x="30" y="78" width="54" height="30" rx="5" fill="#eef3fb" stroke="#17456f" stroke-width="1.5"/>
<rect x="90" y="78" width="54" height="30" rx="5" fill="#eef3fb" stroke="#17456f" stroke-width="1.5"/>
<rect x="150" y="78" width="54" height="30" rx="5" fill="#eef3fb" stroke="#17456f" stroke-width="1.5"/>
<rect x="210" y="78" width="54" height="30" rx="5" fill="#eef3fb" stroke="#17456f" stroke-width="1.5"/>
<rect x="270" y="78" width="54" height="30" rx="5" fill="#eef3fb" stroke="#17456f" stroke-width="1.5"/>
<rect x="330" y="78" width="54" height="30" rx="5" fill="#eef3fb" stroke="#17456f" stroke-width="1.5"/>
<rect x="390" y="78" width="54" height="30" rx="5" fill="#eef3fb" stroke="#17456f" stroke-width="1.5"/>
<rect x="450" y="78" width="54" height="30" rx="5" fill="#eef3fb" stroke="#17456f" stroke-width="1.5"/>
<rect x="510" y="78" width="54" height="30" rx="5" fill="#eef3fb" stroke="#17456f" stroke-width="1.5"/>
<rect x="570" y="78" width="54" height="30" rx="5" fill="#eef3fb" stroke="#17456f" stroke-width="1.5"/>
<rect x="630" y="78" width="54" height="30" rx="5" fill="#eef3fb" stroke="#17456f" stroke-width="1.5"/>
<text x="30" y="146" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0e8f8f">Tu función cargar()</text>
<rect x="30" y="158" width="150" height="44" rx="10" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
<text x="105.0" y="184.76" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12" fill="#0e8f8f">http.get(url)</text>
<rect x="200" y="158" width="300" height="44" rx="10" fill="#fff4e5" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/>
<text x="350.0" y="184.76" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12" fill="#b45309">await ... esperando respuesta ...</text>
<rect x="520" y="158" width="170" height="44" rx="10" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
<text x="605.0" y="184.62" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">sigue en la línea de abajo</text>
<path d="M 182,180 L 198,180" stroke="#5b6876" stroke-width="1.8" fill="none" marker-end="url(#a-grey)"/>
<path d="M 502,180 L 518,180" stroke="#5b6876" stroke-width="1.8" fill="none" marker-end="url(#a-grey)"/>
<path d="M 350,110 L 350,156" stroke="#b45309" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/>
<text x="360" y="235" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#5b6876">Mientras cargar() espera, Flutter sigue ejecutando build y atendiendo toques.</text>
<text x="360" y="258" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#5b6876">await solo detiene a la función que lo escribió, no a toda la app.</text>
<rect x="120" y="278" width="480" height="44" rx="10" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
<text x="360.0" y="304.9" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#17456f">Por eso una función con await se marca async, y devuelve un Future</text>
</svg>
