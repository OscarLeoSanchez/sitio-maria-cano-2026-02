<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="420" viewBox="0 0 680 420" role="img" aria-label="Ciclo de vida de un State: createState y initState corren una vez, build corre muchas veces, y dispose corre una vez al final" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="a153" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5b6876"/></marker></defs>
<text x="340.0" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#17456f">La vida de un State</text>
<rect x="30" y="50" width="190" height="52" rx="10" fill="#f4f6f8" stroke="#5b6876" stroke-width="2"/>
<text x="125.0" y="80.55" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13" font-weight="700" fill="#5b6876">createState()</text>
<rect x="230" y="50" width="300" height="52" rx="10" fill="#ffffff" stroke="#5b6876" stroke-width="2"/>
<text x="380.0" y="80.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">Flutter crea el State</text>
<rect x="540" y="50" width="110" height="52" rx="10" fill="#f4f6f8" stroke="#5b6876" stroke-width="1.4"/>
<text x="595.0" y="79.85" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#5b6876">una vez</text>
<path d="M 125,104 L 125,128" stroke="#5b6876" stroke-width="1.8" fill="none" marker-end="url(#a153)"/>
<rect x="30" y="130" width="190" height="52" rx="10" fill="#fff4e5" stroke="#b45309" stroke-width="2"/>
<text x="125.0" y="160.55" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13" font-weight="700" fill="#b45309">initState()</text>
<rect x="230" y="130" width="300" height="52" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
<text x="380.0" y="160.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">aquí abres la base y pides datos</text>
<rect x="540" y="130" width="110" height="52" rx="10" fill="#fff4e5" stroke="#b45309" stroke-width="1.4"/>
<text x="595.0" y="159.85" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#b45309">una vez</text>
<path d="M 125,184 L 125,208" stroke="#5b6876" stroke-width="1.8" fill="none" marker-end="url(#a153)"/>
<rect x="30" y="210" width="190" height="52" rx="10" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
<text x="125.0" y="240.55" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13" font-weight="700" fill="#0e8f8f">build()</text>
<rect x="230" y="210" width="300" height="52" rx="10" fill="#ffffff" stroke="#0e8f8f" stroke-width="2"/>
<text x="380.0" y="240.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">dibuja la pantalla; cada setState lo repite</text>
<rect x="540" y="210" width="110" height="52" rx="10" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="1.4"/>
<text x="595.0" y="239.85" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#0e8f8f">muchas veces</text>
<path d="M 125,264 L 125,288" stroke="#5b6876" stroke-width="1.8" fill="none" marker-end="url(#a153)"/>
<rect x="30" y="290" width="190" height="52" rx="10" fill="#f6eefb" stroke="#7a3ea1" stroke-width="2"/>
<text x="125.0" y="320.55" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13" font-weight="700" fill="#7a3ea1">dispose()</text>
<rect x="230" y="290" width="300" height="52" rx="10" fill="#ffffff" stroke="#7a3ea1" stroke-width="2"/>
<text x="380.0" y="320.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">la pantalla muere: libera lo que abriste</text>
<rect x="540" y="290" width="110" height="52" rx="10" fill="#f6eefb" stroke="#7a3ea1" stroke-width="1.4"/>
<text x="595.0" y="319.85" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#7a3ea1">una vez</text>
<text x="340" y="385" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#b45309">mounted responde: ¿sigue viva la pantalla? Revísalo después de cada await.</text>
<text x="340" y="405" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6876">Si ya murió, no llames setState.</text>
</svg>
