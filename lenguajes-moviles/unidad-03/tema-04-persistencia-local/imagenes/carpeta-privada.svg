<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="360" viewBox="0 0 680 360" role="img" aria-label="Dentro del celular cada app tiene una carpeta privada con sus preferencias y su base de datos; el almacén seguro del sistema guarda la llave de cifrado aparte" xmlns="http://www.w3.org/2000/svg">
<defs></defs>
<text x="340.0" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#17456f">Dónde queda cada cosa en el celular</text>
<rect x="20" y="50" width="640" height="290" rx="10" fill="#f4f6f8" stroke="#5b6876" stroke-width="2" stroke-dasharray="6 4"/>
<text x="340" y="74" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#5b6876">El celular</text>
<rect x="40" y="90" width="400" height="230" rx="10" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
<text x="240" y="114" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#17456f">Carpeta privada de tu app</text>
<text x="240" y="132" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#5b6876">/data/user/0/&lt;paquete&gt;/</text>
<rect x="60" y="146" width="360" height="50" rx="6" fill="#ffffff" stroke="#0e8f8f" stroke-width="1.6"/>
<text x="240.0" y="166.85" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6876">databases/catalogo.db</text>
<text x="240.0" y="182.85" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6876">tu base SQLite (un archivo)</text>
<rect x="60" y="206" width="360" height="50" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
<text x="240.0" y="226.85" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6876">archivo de shared_preferences</text>
<text x="240.0" y="242.85" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6876">los ajustes: oscuro = true</text>
<rect x="60" y="266" width="360" height="40" rx="6" fill="#ffffff" stroke="#7a3ea1" stroke-width="1.6"/>
<text x="240.0" y="289.85" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6876">dato cifrado de flutter_secure_storage</text>
<rect x="470" y="90" width="170" height="110" rx="10" fill="#f6eefb" stroke="#7a3ea1" stroke-width="2"/>
<text x="555.0" y="132.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#7a3ea1">Almacén seguro</text>
<text x="555.0" y="149.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#7a3ea1">del sistema</text>
<text x="555.0" y="166.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#7a3ea1">guarda la llave</text>
<rect x="470" y="215" width="170" height="105" rx="10" fill="#ffffff" stroke="#9b2c5e" stroke-width="2" stroke-dasharray="6 4"/>
<text x="555.0" y="254.7" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#9b2c5e">Otras apps</text>
<text x="555.0" y="271.7" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#9b2c5e">no pueden leer</text>
<text x="555.0" y="288.7" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#9b2c5e">tu carpeta</text>
</svg>
