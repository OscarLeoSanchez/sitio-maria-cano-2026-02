<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="300" viewBox="0 0 680 300" role="img" aria-label="Las preferencias son pares de clave y valor: la clave oscuro guarda un booleano; solo admiten bool, int, double, String y lista de String, y son para datos pequeños" xmlns="http://www.w3.org/2000/svg">
<defs></defs>
<text x="340.0" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#17456f">Preferencias: clave y valor</text>
<rect x="20" y="55" width="300" height="120" rx="10" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
<text x="170" y="78" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0e8f8f">Archivo de preferencias</text>
<rect x="40" y="90" width="120" height="34" rx="4" fill="#ffffff" stroke="#0e8f8f" stroke-width="1.4"/>
<text x="100.0" y="111.2" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12" fill="#0e8f8f">oscuro</text>
<rect x="170" y="90" width="130" height="34" rx="4" fill="#ffffff" stroke="#0e8f8f" stroke-width="1.4"/>
<text x="235.0" y="111.2" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12" fill="#0e8f8f">true</text>
<rect x="40" y="130" width="120" height="34" rx="4" fill="#ffffff" stroke="#0e8f8f" stroke-width="1.4"/>
<text x="100.0" y="151.2" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12" fill="#0e8f8f">municipio</text>
<rect x="170" y="130" width="130" height="34" rx="4" fill="#ffffff" stroke="#0e8f8f" stroke-width="1.4"/>
<text x="235.0" y="151.2" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12" fill="#0e8f8f">'Envigado'</text>
<text x="100" y="190" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#5b6876">clave</text>
<text x="235" y="190" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#5b6876">valor</text>
<rect x="360" y="55" width="300" height="120" rx="10" fill="#fff4e5" stroke="#b45309" stroke-width="2"/>
<text x="510.0" y="102.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#b45309">Tipos que admite</text>
<text x="510.0" y="119.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#b45309">bool   int   double</text>
<text x="510.0" y="136.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#b45309">String   List&lt;String&gt;</text>
<rect x="20" y="215" width="640" height="60" rx="10" fill="#f4f6f8" stroke="#5b6876" stroke-width="2"/>
<text x="340.0" y="249.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">Sirven para ajustes pequeños. Para un catálogo de cientos de filas, usa SQLite.</text>
</svg>
