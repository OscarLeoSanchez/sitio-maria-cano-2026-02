<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guía de bolsillo</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#12324f">
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 32rem;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #12324f;
    }
    #estado {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      background: #eef4fa;
      border: 1px solid #c7d6e6;
    }
  </style>
</head>
<body>
  <h1>Guía de bolsillo</h1>
  <p>Esta página es el ejemplo mínimo de PWA del Tema 1 de la Unidad 3. Cárgala una vez con
  conexión, después activa el modo avión y recárgala: el service worker responde desde la
  caché y la página sigue abriendo.</p>
  <p id="estado">Comprobando el service worker...</p>

  <script>
    const estado = document.getElementById("estado");

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js")
        .then(() => {
          estado.textContent = "Service worker registrado. Ya puedes probar a cargar esta página sin conexión.";
        })
        .catch((error) => {
          estado.textContent = "No se pudo registrar el service worker: " + error;
        });
    } else {
      estado.textContent = "Este navegador no soporta service workers.";
    }
  </script>
</body>
</html>
