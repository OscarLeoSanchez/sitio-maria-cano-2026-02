<?xml version="1.0" encoding="UTF-8"?>
<svg width="640" height="380" viewBox="0 0 640 380" role="img" aria-label="Pila de navegación: LoginScreen queda en la base de la pila, Navigator.push apila InicioScreen encima, Navigator.pop la retira y vuelve a mostrar LoginScreen" xmlns="http://www.w3.org/2000/svg">
  <text x="320" y="24" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#17456f">Pila de navegación (Navigator)</text>

  <rect x="60" y="150" width="180" height="180" rx="14" fill="#eef3fb" stroke="#17456f" stroke-width="2.5"/>
  <text x="150" y="230" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13" fill="#17456f">LoginScreen</text>
  <text x="150" y="248" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#5b6876">base de la pila</text>

  <rect x="230" y="60" width="180" height="180" rx="14" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2.5"/>
  <text x="320" y="140" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13" fill="#0e8f8f">InicioScreen</text>
  <text x="320" y="158" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#5b6876">apilada encima</text>

  <defs>
    <marker id="flechaPila1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0e8f8f"/>
    </marker>
    <marker id="flechaPila2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9b2c5e"/>
    </marker>
  </defs>

  <path d="M 440,110 L 520,110" stroke="#0e8f8f" stroke-width="1.8" fill="none" marker-end="url(#flechaPila1)"/>
  <text x="480" y="100" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#0e8f8f">Navigator.push</text>

  <path d="M 520,180 L 440,180" stroke="#9b2c5e" stroke-width="1.8" fill="none" marker-end="url(#flechaPila2)"/>
  <text x="480" y="200" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#9b2c5e">Navigator.pop</text>

  <rect x="530" y="60" width="80" height="180" rx="10" fill="#fdf6ec" stroke="#b45309" stroke-width="2"/>
  <text x="570" y="55" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#b45309" font-weight="700">Pila</text>
  <rect x="540" y="70" width="60" height="60" rx="6" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="1.6"/>
  <text x="570" y="104" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9.5" fill="#0e8f8f">Inicio</text>
  <rect x="540" y="150" width="60" height="60" rx="6" fill="#eef3fb" stroke="#17456f" stroke-width="1.6"/>
  <text x="570" y="184" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9.5" fill="#17456f">Login</text>

  <text x="320" y="340" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#94a3b8">push agrega una pantalla arriba de la pila; pop la retira y descubre la anterior</text>
</svg>
