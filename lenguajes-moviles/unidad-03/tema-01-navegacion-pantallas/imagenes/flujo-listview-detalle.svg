<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="260" viewBox="0 0 680 260" role="img" aria-label="Flujo de navegación desde una lista: el usuario toca un ListTile del ListView, se dispara onTap, onTap llama a Navigator.push con los datos del producto, y se muestra DetalleProductoScreen con ese nombre y precio" xmlns="http://www.w3.org/2000/svg">
  <text x="340" y="24" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#17456f">De la lista al detalle, con datos</text>

  <rect x="20" y="70" width="140" height="110" rx="12" fill="#eef3fb" stroke="#17456f" stroke-width="2.2"/>
  <text x="90" y="105" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#17456f">ListView.builder</text>
  <text x="90" y="125" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="10" fill="#17456f">ListTile</text>
  <text x="90" y="141" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9.5" fill="#5b6876">Manzana $3.000</text>
  <text x="90" y="157" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9.5" fill="#5b6876">el usuario toca aquí</text>

  <rect x="200" y="70" width="140" height="110" rx="12" fill="#fdf6ec" stroke="#b45309" stroke-width="2.2"/>
  <text x="270" y="110" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12" font-weight="700" fill="#b45309">onTap</text>
  <text x="270" y="132" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9.5" fill="#5b6876">se dispara al tocar</text>
  <text x="270" y="148" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9.5" fill="#5b6876">el ListTile</text>

  <rect x="380" y="70" width="150" height="110" rx="12" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2.2"/>
  <text x="455" y="102" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="10.5" font-weight="700" fill="#0e8f8f">Navigator.push</text>
  <text x="455" y="122" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9.5" fill="#5b6876">nombre: producto</text>
  <text x="455" y="137" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9.5" fill="#5b6876">precio: producto</text>
  <text x="455" y="155" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#94a3b8">los datos viajan por</text>
  <text x="455" y="167" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#94a3b8">el constructor</text>

  <rect x="560" y="70" width="100" height="110" rx="12" fill="#f6eefb" stroke="#7a3ea1" stroke-width="2.2"/>
  <text x="610" y="105" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="10" font-weight="700" fill="#7a3ea1">Detalle</text>
  <text x="610" y="121" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="10" font-weight="700" fill="#7a3ea1">Producto</text>
  <text x="610" y="137" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="10" font-weight="700" fill="#7a3ea1">Screen</text>
  <text x="610" y="157" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#5b6876">muestra ese</text>
  <text x="610" y="169" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#5b6876">producto exacto</text>

  <defs>
    <marker id="flechaFlujo" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5b6876"/>
    </marker>
  </defs>
  <path d="M 160,125 L 196,125" stroke="#5b6876" stroke-width="1.8" fill="none" marker-end="url(#flechaFlujo)"/>
  <path d="M 340,125 L 376,125" stroke="#5b6876" stroke-width="1.8" fill="none" marker-end="url(#flechaFlujo)"/>
  <path d="M 530,125 L 556,125" stroke="#5b6876" stroke-width="1.8" fill="none" marker-end="url(#flechaFlujo)"/>

  <text x="340" y="230" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#94a3b8">cada producto de la lista abre el mismo widget, pero con datos distintos</text>
</svg>
