<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="320" viewBox="0 0 680 320" role="img" aria-label="Dos niveles de navegación conviviendo: una fila horizontal con las secciones principales Inicio, Productos, Carrito y Perfil manejadas por NavigationBar, y desde la sección Productos una rama hacia abajo con Navigator.push hacia Detalle producto, que es navegación secundaria" xmlns="http://www.w3.org/2000/svg">
  <text x="340" y="24" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#17456f">Dos niveles de navegación a la vez</text>

  <text x="120" y="58" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#b45309">Nivel 1: secciones principales (NavigationBar)</text>

  <rect x="20" y="70" width="130" height="60" rx="10" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
  <text x="85" y="105" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#17456f">Inicio</text>

  <rect x="170" y="70" width="130" height="60" rx="10" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2.6"/>
  <text x="235" y="105" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#0e8f8f">Productos</text>

  <rect x="320" y="70" width="130" height="60" rx="10" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
  <text x="385" y="105" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#17456f">Carrito</text>

  <rect x="470" y="70" width="130" height="60" rx="10" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
  <text x="535" y="105" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#17456f">Perfil</text>

  <defs>
    <marker id="flechaNivel" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5b6876"/>
    </marker>
    <marker id="flechaPush2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0e8f8f"/>
    </marker>
  </defs>

  <path d="M 150,100 L 166,100" stroke="#5b6876" stroke-width="1.6" fill="none" marker-end="url(#flechaNivel)"/>
  <path d="M 300,100 L 316,100" stroke="#5b6876" stroke-width="1.6" fill="none" marker-end="url(#flechaNivel)"/>
  <path d="M 450,100 L 466,100" stroke="#5b6876" stroke-width="1.6" fill="none" marker-end="url(#flechaNivel)"/>
  <text x="330" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9.5" fill="#94a3b8">secciones hermanas, ninguna está dentro de otra</text>

  <path d="M 235,130 L 235,190" stroke="#0e8f8f" stroke-width="2" fill="none" marker-end="url(#flechaPush2)"/>
  <text x="255" y="175" text-anchor="start" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="10" fill="#0e8f8f">Navigator.push</text>

  <text x="120" y="215" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#b45309">Nivel 2: navegación secundaria (Navigator)</text>

  <rect x="170" y="225" width="160" height="70" rx="12" fill="#f6eefb" stroke="#7a3ea1" stroke-width="2.4"/>
  <text x="250" y="255" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" font-weight="700" fill="#7a3ea1">DetalleProducto</text>
  <text x="250" y="271" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" font-weight="700" fill="#7a3ea1">Screen</text>
  <text x="250" y="287" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9.5" fill="#5b6876">apilada sobre Productos</text>

  <text x="340" y="315" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#94a3b8">el Navbar cambia de sección; Navigator.push profundiza dentro de una sección</text>
</svg>
