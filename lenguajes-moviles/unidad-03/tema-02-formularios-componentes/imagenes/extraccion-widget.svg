<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="360" viewBox="0 0 680 360" role="img" aria-label="Antes y después de extraer un widget reutilizable: antes, tres TextFormField casi idénticos repetidos dentro del mismo build; después, un solo widget CampoTexto reutilizado tres veces con parámetros distintos" xmlns="http://www.w3.org/2000/svg">
  <text x="340" y="24" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#17456f">Extraer un widget reutilizable</text>

  <text x="160" y="55" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#9b2c5e">Antes</text>
  <rect x="40" y="70" width="240" height="220" rx="12" fill="#fbecf2" stroke="#9b2c5e" stroke-width="2"/>
  <rect x="56" y="86" width="208" height="52" rx="6" fill="#ffffff" stroke="#9b2c5e" stroke-width="1.4"/>
  <text x="160" y="116" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="10.5" fill="#9b2c5e">TextFormField (nombre)</text>
  <rect x="56" y="150" width="208" height="52" rx="6" fill="#ffffff" stroke="#9b2c5e" stroke-width="1.4"/>
  <text x="160" y="180" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="10.5" fill="#9b2c5e">TextFormField (correo)</text>
  <rect x="56" y="214" width="208" height="52" rx="6" fill="#ffffff" stroke="#9b2c5e" stroke-width="1.4"/>
  <text x="160" y="244" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="10.5" fill="#9b2c5e">TextFormField (contraseña)</text>
  <text x="160" y="305" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#5b6876">decoración y validator repetidos tres veces</text>

  <defs>
    <marker id="flechaExtraccion" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#17456f"/>
    </marker>
  </defs>
  <path d="M 290,180 L 380,180" stroke="#17456f" stroke-width="2" fill="none" marker-end="url(#flechaExtraccion)"/>
  <text x="335" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#17456f">extraer</text>

  <text x="530" y="55" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0e8f8f">Después</text>
  <rect x="400" y="70" width="240" height="220" rx="12" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
  <rect x="440" y="86" width="160" height="34" rx="8" fill="#ffffff" stroke="#0e8f8f" stroke-width="1.6"/>
  <text x="520" y="108" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="10.5" fill="#0e8f8f" font-weight="700">CampoTexto</text>
  <rect x="416" y="140" width="208" height="40" rx="6" fill="#ffffff" stroke="#0e8f8f" stroke-width="1.4"/>
  <text x="520" y="164" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="10" fill="#0e8f8f">CampoTexto(etiqueta: nombre)</text>
  <rect x="416" y="190" width="208" height="40" rx="6" fill="#ffffff" stroke="#0e8f8f" stroke-width="1.4"/>
  <text x="520" y="214" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="10" fill="#0e8f8f">CampoTexto(etiqueta: correo)</text>
  <rect x="416" y="240" width="208" height="40" rx="6" fill="#ffffff" stroke="#0e8f8f" stroke-width="1.4"/>
  <text x="520" y="264" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="10" fill="#0e8f8f">CampoTexto(etiqueta: contraseña)</text>
  <text x="520" y="305" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#5b6876">un solo widget, tres instancias con parámetros</text>

  <text x="340" y="340" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#94a3b8">se repite el mismo widget con distintos parámetros en vez de repetir el mismo código</text>
</svg>
