<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="470" viewBox="0 0 680 470" role="img" aria-label="Flujo red primero y caché después: se pide a la red; si responde se guarda en SQLite; en ambos casos se lee de SQLite y se pinta, con aviso si no hubo red" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="a153" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5b6876"/></marker><marker id="a1042" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2f7d32"/></marker><marker id="a3648" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9b2c5e"/></marker></defs>
<text x="340.0" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#17456f">Primero la red, después lo guardado</text>
<rect x="240" y="45" width="200" height="40" rx="10" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
<text x="340.0" y="69.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#17456f">Se abre la pantalla</text>
<path d="M 340,87 L 340,105" stroke="#5b6876" stroke-width="1.8" fill="none" marker-end="url(#a153)"/>
<rect x="240" y="107" width="200" height="40" rx="10" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
<text x="340.0" y="131.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#17456f">Pedir el catálogo a la red</text>
<path d="M 340,149 L 340,172" stroke="#5b6876" stroke-width="1.8" fill="none" marker-end="url(#a153)"/>
<rect x="240" y="174" width="200" height="46" rx="10" fill="#fff4e5" stroke="#b45309" stroke-width="2"/>
<text x="340.0" y="201.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#b45309">¿Respondió bien?</text>
<path d="M 240,197 L 150,197 L 150,240" stroke="#2f7d32" stroke-width="1.8" fill="none" marker-end="url(#a1042)"/>
<text x="195" y="190" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#2f7d32">Sí</text>
<path d="M 440,197 L 530,197 L 530,240" stroke="#9b2c5e" stroke-width="1.8" fill="none" marker-end="url(#a3648)"/>
<text x="448" y="190" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#9b2c5e">No (falló la petición)</text>
<rect x="40" y="242" width="220" height="44" rx="10" fill="#eaf6ea" stroke="#2f7d32" stroke-width="2"/>
<text x="150.0" y="259.85" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#2f7d32">Guardar en SQLite</text>
<text x="150.0" y="275.85" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#2f7d32">(borra lo viejo, inserta lo nuevo)</text>
<rect x="420" y="242" width="220" height="44" rx="10" fill="#fbecf2" stroke="#9b2c5e" stroke-width="2"/>
<text x="530.0" y="259.85" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#9b2c5e">No tocar la base</text>
<text x="530.0" y="275.85" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#9b2c5e">(queda lo último guardado)</text>
<path d="M 150,288 L 150,326 L 228,326" stroke="#5b6876" stroke-width="1.8" fill="none" marker-end="url(#a153)"/>
<path d="M 530,288 L 530,326 L 452,326" stroke="#5b6876" stroke-width="1.8" fill="none" marker-end="url(#a153)"/>
<rect x="230" y="304" width="220" height="44" rx="10" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
<text x="340.0" y="330.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0e8f8f">Leer de SQLite</text>
<path d="M 340,350 L 340,372" stroke="#5b6876" stroke-width="1.8" fill="none" marker-end="url(#a153)"/>
<rect x="150" y="374" width="380" height="50" rx="10" fill="#ffffff" stroke="#0e8f8f" stroke-width="2"/>
<text x="340.0" y="394.7" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#5b6876">Pintar la lista</text>
<text x="340.0" y="411.7" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">con aviso solo si no hubo red</text>
<text x="340" y="450" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6876">La pantalla siempre pinta lo que dice la base. Esa es la única fuente.</text>
</svg>
