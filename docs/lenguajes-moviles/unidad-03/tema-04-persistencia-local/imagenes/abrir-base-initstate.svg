<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="430" viewBox="0 0 680 430" role="img" aria-label="Línea de tiempo de la pantalla: initState llama a cargar, cargar abre la base con await y lee las filas, setState guarda la lista y build dibuja de nuevo" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="a153" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5b6876"/></marker></defs>
<text x="340.0" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#17456f">Abrir la base en initState</text>
<rect x="30" y="45" width="220" height="44" rx="10" fill="#fff4e5" stroke="#b45309" stroke-width="2"/>
<text x="140.0" y="71.2" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12" font-weight="700" fill="#b45309">initState()</text>
<rect x="260" y="45" width="390" height="44" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
<text x="455.0" y="71.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">llama a cargar() y sigue sin esperar</text>
<path d="M 140,91 L 140,104" stroke="#5b6876" stroke-width="1.8" fill="none" marker-end="url(#a153)"/>
<rect x="30" y="105" width="220" height="44" rx="10" fill="#f4f6f8" stroke="#5b6876" stroke-width="2"/>
<text x="140.0" y="131.2" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12" font-weight="700" fill="#5b6876">build() por primera vez</text>
<rect x="260" y="105" width="390" height="44" rx="10" fill="#ffffff" stroke="#5b6876" stroke-width="2"/>
<text x="455.0" y="131.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">lista vacía: se ve el indicador de carga</text>
<path d="M 140,151 L 140,164" stroke="#5b6876" stroke-width="1.8" fill="none" marker-end="url(#a153)"/>
<rect x="30" y="165" width="220" height="44" rx="10" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
<text x="140.0" y="191.2" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12" font-weight="700" fill="#17456f">await abrirBase()</text>
<rect x="260" y="165" width="390" height="44" rx="10" fill="#ffffff" stroke="#17456f" stroke-width="2"/>
<text x="455.0" y="191.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">abre el archivo; crea la tabla si no existía</text>
<path d="M 140,211 L 140,224" stroke="#5b6876" stroke-width="1.8" fill="none" marker-end="url(#a153)"/>
<rect x="30" y="225" width="220" height="44" rx="10" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
<text x="140.0" y="251.2" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12" font-weight="700" fill="#17456f">await leerCatalogo()</text>
<rect x="260" y="225" width="390" height="44" rx="10" fill="#ffffff" stroke="#17456f" stroke-width="2"/>
<text x="455.0" y="251.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">lee las filas de la tabla productos</text>
<path d="M 140,271 L 140,284" stroke="#5b6876" stroke-width="1.8" fill="none" marker-end="url(#a153)"/>
<rect x="30" y="285" width="220" height="44" rx="10" fill="#fff4e5" stroke="#b45309" stroke-width="2"/>
<text x="140.0" y="311.2" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12" font-weight="700" fill="#b45309">setState(...)</text>
<rect x="260" y="285" width="390" height="44" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
<text x="455.0" y="311.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">guarda la lista en el State</text>
<path d="M 140,331 L 140,344" stroke="#5b6876" stroke-width="1.8" fill="none" marker-end="url(#a153)"/>
<rect x="30" y="345" width="220" height="44" rx="10" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
<text x="140.0" y="371.2" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12" font-weight="700" fill="#0e8f8f">build() otra vez</text>
<rect x="260" y="345" width="390" height="44" rx="10" fill="#ffffff" stroke="#0e8f8f" stroke-width="2"/>
<text x="455.0" y="371.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">ahora dibuja los productos</text>
</svg>
