<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="260" viewBox="0 0 680 260" role="img" aria-label="Ciclo de setState: el usuario toca, onPressed cambia la variable dentro de setState, Flutter vuelve a ejecutar build y la pantalla se dibuja con el valor nuevo" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="a153" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5b6876"/></marker></defs>
<text x="340.0" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#17456f">El ciclo setState y build</text>
<rect x="20" y="60" width="140" height="80" rx="10" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
<text x="90.0" y="95.85" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#17456f">1. Toque</text>
<text x="90.0" y="111.85" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#17456f">el usuario pulsa +</text>
<path d="M 162,100 L 183,100" stroke="#5b6876" stroke-width="1.8" fill="none" marker-end="url(#a153)"/>
<rect x="185" y="60" width="140" height="80" rx="10" fill="#fff4e5" stroke="#b45309" stroke-width="2"/>
<text x="255.0" y="95.85" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#b45309">2. setState</text>
<text x="255.0" y="111.85" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#b45309">cambias la variable</text>
<path d="M 327,100 L 348,100" stroke="#5b6876" stroke-width="1.8" fill="none" marker-end="url(#a153)"/>
<rect x="350" y="60" width="140" height="80" rx="10" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
<text x="420.0" y="95.85" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#0e8f8f">3. build</text>
<text x="420.0" y="111.85" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#0e8f8f">Flutter lo repite</text>
<path d="M 492,100 L 513,100" stroke="#5b6876" stroke-width="1.8" fill="none" marker-end="url(#a153)"/>
<rect x="515" y="60" width="140" height="80" rx="10" fill="#eaf6ea" stroke="#2f7d32" stroke-width="2"/>
<text x="585.0" y="95.85" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#2f7d32">4. Pantalla</text>
<text x="585.0" y="111.85" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#2f7d32">se ve el valor nuevo</text>
<path d="M 590,142 L 590,190 L 90,190 L 90,144" stroke="#5b6876" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#a153)"/>
<text x="340" y="208" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6876">el usuario vuelve a tocar y el ciclo se repite</text>
<text x="340" y="240" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#9b2c5e">Sin el paso 2, el valor cambia en memoria pero nadie pide ejecutar build otra vez.</text>
</svg>
