<rect x="460" y="308" width="200" height="48" rx="10" fill="#ffffff" stroke="#7a3ea1" stroke-width="2"/>
<text x="560.0" y="336.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">la ficha de sesión</text>
<rect x="20" y="368" width="200" height="48" rx="10" fill="#fbecf2" stroke="#9b2c5e" stroke-width="2"/>
<text x="120.0" y="396.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#9b2c5e">La nube (servidor)</text>
<rect x="230" y="368" width="220" height="48" rx="10" fill="#ffffff" stroke="#9b2c5e" stroke-width="2"/>
<text x="340.0" y="396.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">datos de todos</text>
<rect x="460" y="368" width="200" height="48" rx="10" fill="#ffffff" stroke="#9b2c5e" stroke-width="2"/>
<text x="560.0" y="396.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">el catálogo oficial</text>
<text x="340" y="430" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6876">Cada dato va en el lugar que mejor le queda</text>
