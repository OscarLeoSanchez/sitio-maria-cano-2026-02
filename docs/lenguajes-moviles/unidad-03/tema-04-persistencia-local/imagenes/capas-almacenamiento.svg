<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="440" viewBox="0 0 680 440" role="img" aria-label="Seis lugares donde puede vivir un dato, de la memoria RAM a la nube, con el tipo de dato y un ejemplo del proyecto para cada uno" xmlns="http://www.w3.org/2000/svg">
<defs></defs>
<text x="340.0" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#17456f">Seis lugares donde puede vivir un dato</text>
<text x="120" y="58" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#5b6876">Lugar</text>
<text x="340" y="58" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#5b6876">Qué guarda bien</text>
<text x="560" y="58" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#5b6876">Ejemplo del proyecto</text>
<rect x="20" y="68" width="200" height="48" rx="10" fill="#f4f6f8" stroke="#5b6876" stroke-width="2"/>
