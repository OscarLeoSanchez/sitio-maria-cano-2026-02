<rect x="230" y="68" width="220" height="48" rx="10" fill="#ffffff" stroke="#5b6876" stroke-width="2"/>
<text x="340.0" y="96.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">variables y State</text>
<rect x="460" y="68" width="200" height="48" rx="10" fill="#ffffff" stroke="#5b6876" stroke-width="2"/>
<text x="560.0" y="96.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">la lista en pantalla</text>
<rect x="20" y="128" width="200" height="48" rx="10" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
<text x="120.0" y="156.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0e8f8f">Preferencias</text>
<rect x="230" y="128" width="220" height="48" rx="10" fill="#ffffff" stroke="#0e8f8f" stroke-width="2"/>
<text x="340.0" y="156.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">un valor sencillo</text>
<rect x="460" y="128" width="200" height="48" rx="10" fill="#ffffff" stroke="#0e8f8f" stroke-width="2"/>
<text x="560.0" y="156.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">tema oscuro: true</text>
<rect x="20" y="188" width="200" height="48" rx="10" fill="#fff4e5" stroke="#b45309" stroke-width="2"/>
<text x="120.0" y="216.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#b45309">Archivo</text>
<rect x="230" y="188" width="220" height="48" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
<text x="340.0" y="216.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">un texto o una imagen</text>
<rect x="460" y="188" width="200" height="48" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
<text x="560.0" y="216.2" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">una foto descargada</text>
