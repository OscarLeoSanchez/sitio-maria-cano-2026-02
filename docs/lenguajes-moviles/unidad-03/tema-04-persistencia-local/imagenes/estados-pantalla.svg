<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="340" viewBox="0 0 680 340" role="img" aria-label="Los cuatro estados de la pantalla de catálogo: cargando, listo cuando la red respondió, sinConexion cuando falló la red pero hay filas guardadas, y vacio cuando no hay nada que mostrar" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="a1042" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2f7d32"/></marker><marker id="a8942" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b45309"/></marker><marker id="a3648" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9b2c5e"/></marker></defs>
<text x="340.0" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#17456f">Los cuatro estados del catálogo</text>
<rect x="30" y="130" width="150" height="60" rx="10" fill="#f4f6f8" stroke="#5b6876" stroke-width="2"/>
<text x="105.0" y="155.7" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12" font-weight="700" fill="#5b6876">cargando</text>
<text x="105.0" y="172.7" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12" fill="#5b6876">círculo girando</text>
<rect x="300" y="50" width="200" height="60" rx="10" fill="#eaf6ea" stroke="#2f7d32" stroke-width="2"/>
<text x="400.0" y="75.7" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12" font-weight="700" fill="#2f7d32">listo</text>
<text x="400.0" y="92.7" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12" fill="#2f7d32">la red respondió</text>
<rect x="300" y="135" width="200" height="60" rx="10" fill="#fff4e5" stroke="#b45309" stroke-width="2"/>
<text x="400.0" y="160.7" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12" font-weight="700" fill="#b45309">sinConexion</text>
<text x="400.0" y="177.7" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12" fill="#b45309">falló la red, hay filas</text>
<rect x="300" y="220" width="200" height="60" rx="10" fill="#fbecf2" stroke="#9b2c5e" stroke-width="2"/>
<text x="400.0" y="245.7" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12" font-weight="700" fill="#9b2c5e">vacio</text>
<text x="400.0" y="262.7" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12" fill="#9b2c5e">no hay filas para mostrar</text>
<path d="M 182,150 L 298,82" stroke="#2f7d32" stroke-width="1.8" fill="none" marker-end="url(#a1042)"/>
<path d="M 182,160 L 298,165" stroke="#b45309" stroke-width="1.8" fill="none" marker-end="url(#a8942)"/>
<path d="M 182,175 L 298,245" stroke="#9b2c5e" stroke-width="1.8" fill="none" marker-end="url(#a3648)"/>
<text x="540" y="82" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#2f7d32">confirmar: activo</text>
<text x="540" y="160" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#b45309">confirmar: bloqueado</text>
<text x="540" y="245" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#9b2c5e">confirmar: bloqueado</text>
<text x="340" y="315" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">Después de cargar, la pantalla termina en uno de los otros tres estados.</text>
</svg>
