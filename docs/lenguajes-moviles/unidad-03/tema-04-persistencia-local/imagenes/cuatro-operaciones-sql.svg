<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="470" viewBox="0 0 680 470" role="img" aria-label="Las cuatro operaciones de SQL sobre la tabla productos: INSERT agrega una fila, SELECT lee, UPDATE cambia y DELETE borra" xmlns="http://www.w3.org/2000/svg">
<defs></defs>
<text x="340.0" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#17456f">Las cuatro operaciones</text>
<rect x="20" y="50" width="310" height="190" rx="10" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
<text x="175" y="78" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#17456f">INSERT</text>
<text x="175" y="98" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">agrega una fila</text>
<rect x="32" y="112" width="286" height="62" rx="6" fill="#ffffff" stroke="#17456f" stroke-width="1.4"/>
<text x="175.0" y="138.85" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#5b6876">INSERT INTO productos</text>
<text x="175.0" y="154.85" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#5b6876">VALUES (4, 'Panela', 5500, 1);</text>
<text x="175" y="214" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#17456f">Resultado: 4 filas</text>
<rect x="350" y="50" width="310" height="190" rx="10" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
<text x="505" y="78" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#0e8f8f">SELECT</text>
<text x="505" y="98" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">lee filas</text>
<rect x="362" y="112" width="286" height="62" rx="6" fill="#ffffff" stroke="#0e8f8f" stroke-width="1.4"/>
<text x="505.0" y="138.85" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#5b6876">SELECT * FROM productos</text>
<text x="505.0" y="154.85" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#5b6876">WHERE disponible = 1;</text>
<text x="505" y="214" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0e8f8f">Resultado: solo las disponibles</text>
<rect x="20" y="255" width="310" height="190" rx="10" fill="#fff4e5" stroke="#b45309" stroke-width="2"/>
<text x="175" y="283" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#b45309">UPDATE</text>
<text x="175" y="303" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">cambia una fila</text>
<rect x="32" y="317" width="286" height="62" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
<text x="175.0" y="343.85" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#5b6876">UPDATE productos</text>
<text x="175.0" y="359.85" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#5b6876">SET disponible = 0 WHERE id = 2;</text>
<text x="175" y="419" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#b45309">Resultado: id 2 queda en 0</text>
<rect x="350" y="255" width="310" height="190" rx="10" fill="#fbecf2" stroke="#9b2c5e" stroke-width="2"/>
<text x="505" y="283" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#9b2c5e">DELETE</text>
<text x="505" y="303" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">borra filas</text>
<rect x="362" y="317" width="286" height="40" rx="6" fill="#ffffff" stroke="#9b2c5e" stroke-width="1.4"/>
<text x="505.0" y="340.85" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#5b6876">DELETE FROM productos;</text>
<text x="505" y="419" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#9b2c5e">Resultado: 0 filas</text>
<text x="340" y="462" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6876">Con sqflite no escribes todo esto: insert, query, update y delete lo arman por ti.</text>
</svg>
