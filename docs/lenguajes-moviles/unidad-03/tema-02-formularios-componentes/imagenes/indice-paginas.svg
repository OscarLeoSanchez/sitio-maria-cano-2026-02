<?xml version="1.0" encoding="UTF-8"?>
<svg width="640" height="320" viewBox="0 0 640 320" role="img" aria-label="Mapeo de índice a página: paginaActual vale 1, la lista páginas tiene a InicioScreen en el índice 0, ProductosScreen en el índice 1, CarritoScreen en el índice 2 y PerfilScreen en el índice 3, y el body del Scaffold muestra páginas en el índice actual, que es ProductosScreen" xmlns="http://www.w3.org/2000/svg">
  <text x="320" y="24" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#17456f">paginaActual decide qué se muestra</text>

  <rect x="40" y="60" width="150" height="50" rx="10" fill="#fdf6ec" stroke="#b45309" stroke-width="2.2"/>
  <text x="115" y="82" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" font-weight="700" fill="#b45309">paginaActual</text>
  <text x="115" y="100" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13" fill="#b45309">= 1</text>

  <text x="330" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6876">lista páginas, en orden</text>

  <rect x="230" y="120" width="100" height="46" rx="8" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
  <text x="280" y="140" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9.5" fill="#17456f">índice 0</text>
  <text x="280" y="155" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="9.5" fill="#17456f">InicioScreen</text>

  <rect x="340" y="120" width="100" height="46" rx="8" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2.6"/>
  <text x="390" y="140" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9.5" fill="#0e8f8f">índice 1</text>
  <text x="390" y="155" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="9.5" fill="#0e8f8f">Productos</text>

  <rect x="450" y="120" width="100" height="46" rx="8" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
  <text x="500" y="140" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9.5" fill="#17456f">índice 2</text>
  <text x="500" y="155" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="9.5" fill="#17456f">Carrito</text>

  <rect x="560" y="120" width="70" height="46" rx="8" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
  <text x="595" y="140" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9.5" fill="#17456f">índice 3</text>
  <text x="595" y="155" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="9.5" fill="#17456f">Perfil</text>

  <defs>
    <marker id="flechaIndice" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b45309"/>
    </marker>
  </defs>
  <path d="M 115,110 L 130,110 L 130,143 L 226,143" stroke="#b45309" stroke-width="1.8" fill="none" marker-end="url(#flechaIndice)"/>

  <rect x="230" y="220" width="210" height="60" rx="12" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2.6"/>
  <text x="335" y="245" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="10.5" fill="#0e8f8f">body: páginas[paginaActual]</text>
  <text x="335" y="264" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5b6876">se muestra ProductosScreen</text>

  <path d="M 390,166 L 390,216" stroke="#0e8f8f" stroke-width="1.8" fill="none" marker-end="url(#flechaIndice)"/>

  <text x="320" y="310" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#94a3b8">tocar un destino del NavigationBar cambia paginaActual con setState</text>
</svg>
