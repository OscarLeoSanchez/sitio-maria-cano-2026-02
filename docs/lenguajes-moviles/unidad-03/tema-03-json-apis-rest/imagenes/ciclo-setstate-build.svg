<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="Ciclo de setState: el usuario toca el botón, onPressed cambia la variable dentro de setState, Flutter marca la pantalla para reconstruir, build se ejecuta de nuevo y la pantalla muestra el valor nuevo" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="a-grey" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5b6876"/></marker></defs>
<text x="360.0" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#17456f">setState pide a Flutter que ejecute build otra vez</text>
<rect x="40" y="55" width="280" height="80" rx="10" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
<text x="180.0" y="91.26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#17456f">1. Evento</text>
<text x="180.0" y="108.26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#17456f">La persona pulsa el botón</text>
<rect x="400" y="55" width="280" height="80" rx="10" fill="#f6eefb" stroke="#7a3ea1" stroke-width="2"/>
<text x="540.0" y="83.48" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#7a3ea1">2. Tu código</text>
<text x="540.0" y="99.48" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#17456f">setState(() { cuenta = cuenta + 1; })</text>
<text x="540.0" y="115.48" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#17456f">cambia la variable</text>
<rect x="400" y="190" width="280" height="80" rx="10" fill="#fff4e5" stroke="#b45309" stroke-width="2"/>
<text x="540.0" y="218.12" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#b45309">3. Flutter marca la pantalla</text>
<text x="540.0" y="234.62" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">setState avisa: esta pantalla cambió</text>
<text x="540.0" y="251.12" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">ya no es lo que se ve</text>
<rect x="40" y="190" width="280" height="80" rx="10" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
<text x="180.0" y="218.12" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#0e8f8f">4. build corre otra vez</text>
<text x="180.0" y="234.62" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">Flutter ejecuta build() de nuevo</text>
<text x="180.0" y="251.12" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">y dibuja Text('Llevas 1')</text>
<path d="M 322,95 L 398,95" stroke="#5b6876" stroke-width="2" fill="none" marker-end="url(#a-grey)"/>
<path d="M 540,137 L 540,188" stroke="#5b6876" stroke-width="2" fill="none" marker-end="url(#a-grey)"/>
<path d="M 398,230 L 322,230" stroke="#5b6876" stroke-width="2" fill="none" marker-end="url(#a-grey)"/>
<path d="M 180,188 L 180,137" stroke="#5b6876" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#a-grey)"/>
<text x="190" y="170" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6876">y la pantalla queda quieta</text>
<text x="190" y="184" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6876">hasta el próximo evento</text>
</svg>
