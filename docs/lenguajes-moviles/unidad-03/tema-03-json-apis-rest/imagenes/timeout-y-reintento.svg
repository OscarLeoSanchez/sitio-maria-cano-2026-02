<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="Tiempo de espera y reintento: la petición espera como máximo 5 segundos; si responde a tiempo muestra los datos, si tarda lanza TimeoutException y si no hay red lanza SocketException; en ambos errores aparece el botón Reintentar, que repite la petición" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="a-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2e7d5b"/></marker><marker id="a-grey" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5b6876"/></marker><marker id="a-orange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/></marker><marker id="a-red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a32d22"/></marker></defs>
<text x="360.0" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#17456f">Esperar, pero no para siempre</text>
<rect x="20" y="140" width="150" height="70" rx="10" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
<text x="95.0" y="163.12" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#0e8f8f">Pedir</text>
<text x="95.0" y="179.62" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11.5" fill="#0e8f8f">http.get(url)</text>
<text x="95.0" y="196.12" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11.5" fill="#0e8f8f">.timeout(5 s)</text>
<rect x="280" y="55" width="200" height="64" rx="10" fill="#f4faf7" stroke="#2e7d5b" stroke-width="2"/>
<text x="380.0" y="83.37" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#2e7d5b">Respondió a tiempo</text>
<text x="380.0" y="99.87" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">pantalla en estado listo</text>
<rect x="280" y="150" width="200" height="64" rx="10" fill="#fff4e5" stroke="#b45309" stroke-width="2"/>
<text x="380.0" y="178.37" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#b45309">Pasaron 5 s sin respuesta</text>
<text x="380.0" y="194.87" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">TimeoutException</text>
<rect x="280" y="245" width="200" height="64" rx="10" fill="#fdf3f2" stroke="#a32d22" stroke-width="2"/>
<text x="380.0" y="273.37" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#a32d22">No hay red</text>
<text x="380.0" y="289.87" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">SocketException</text>
<path d="M 172,165 L 250,90 L 278,90" stroke="#2e7d5b" stroke-width="2" fill="none" marker-end="url(#a-green)"/>
<path d="M 172,175 L 278,182" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#a-orange)"/>
<path d="M 172,195 L 250,277 L 278,277" stroke="#a32d22" stroke-width="2" fill="none" marker-end="url(#a-red)"/>
<rect x="540" y="150" width="160" height="64" rx="10" fill="#fdf3f2" stroke="#a32d22" stroke-width="2"/>
<text x="620.0" y="170.12" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#a32d22">estado error</text>
<text x="620.0" y="186.62" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">Mensaje claro</text>
<text x="620.0" y="203.12" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">+ botón Reintentar</text>
<path d="M 482,182 L 538,182" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#a-orange)"/>
<path d="M 482,277 L 520,277 L 520,195 L 538,195" stroke="#a32d22" stroke-width="2" fill="none" marker-end="url(#a-red)"/>
<path d="M 620,216 L 620,335 L 95,335 L 95,212" stroke="#5b6876" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#a-grey)"/>
<text x="360" y="352" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">Reintentar: el mismo código vuelve a correr</text>
</svg>
