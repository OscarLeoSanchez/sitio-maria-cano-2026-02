<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="380" viewBox="0 0 720 380" role="img" aria-label="Máquina de cuatro estados de la pantalla: empieza en cargando; si llegan datos pasa a listo, si llega una lista vacía pasa a vacío, si falla pasa a error; desde error, el botón Reintentar vuelve a cargando" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="a-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#17456f"/></marker><marker id="a-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2e7d5b"/></marker><marker id="a-grey" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5b6876"/></marker><marker id="a-red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a32d22"/></marker></defs>
<text x="360.0" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#17456f">Los cuatro estados de una pantalla que pide datos</text>
<rect x="40" y="150" width="170" height="80" rx="10" fill="#fff4e5" stroke="#b45309" stroke-width="2"/>
<text x="125.0" y="186.26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#b45309">cargando</text>
<text x="125.0" y="203.26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#17456f">Spinner de carga</text>
<rect x="480" y="60" width="190" height="76" rx="10" fill="#f4faf7" stroke="#2e7d5b" stroke-width="2"/>
<text x="575.0" y="94.26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#2e7d5b">listo</text>
<text x="575.0" y="111.26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#17456f">Muestra la lista</text>
<rect x="480" y="156" width="190" height="76" rx="10" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
<text x="575.0" y="190.26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#17456f">vacío</text>
<text x="575.0" y="207.26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#17456f">Aviso: no hay nada</text>
<rect x="480" y="252" width="190" height="76" rx="10" fill="#fdf3f2" stroke="#a32d22" stroke-width="2"/>
<text x="575.0" y="286.26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#a32d22">error</text>
<text x="575.0" y="303.26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#17456f">Mensaje + Reintentar</text>
<path d="M 8,190 L 38,190" stroke="#5b6876" stroke-width="2" fill="none" marker-end="url(#a-grey)"/>
<text x="8" y="175" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5b6876">inicio</text>
<path d="M 212,175 L 300,98 L 478,98" stroke="#2e7d5b" stroke-width="2" fill="none" marker-end="url(#a-green)"/>
<text x="300" y="82" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#2e7d5b">llegan datos</text>
<path d="M 212,190 L 478,194" stroke="#17456f" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
<text x="345" y="180" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">llega lista vacía</text>
<path d="M 212,205 L 300,290 L 478,290" stroke="#a32d22" stroke-width="2" fill="none" marker-end="url(#a-red)"/>
<text x="300" y="316" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#a32d22">falla o tarda demasiado</text>
<path d="M 575,330 L 575,350 L 125,350 L 125,232" stroke="#5b6876" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#a-grey)"/>
<text x="350" y="368" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">Reintentar: vuelve a cargando y pide otra vez</text>
</svg>
