<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="350" viewBox="0 0 720 350" role="img" aria-label="Regla de temporada didáctica: si la lluvia es mayor que cero el clima es lluvioso, si no es templado. Una tabla fija dice qué productos van con cada clima, y los productos no disponibles se retiran" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="a-grey" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5b6876"/></marker><marker id="a-orange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/></marker></defs>
<text x="360.0" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#17456f">Regla didáctica de temporada</text>
<rect x="20" y="55" width="190" height="80" rx="10" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
<text x="115.0" y="83.48" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#0e8f8f">Clima de hoy</text>
<text x="115.0" y="99.48" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#17456f">precipitation: 0.1 mm</text>
<text x="115.0" y="115.48" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#17456f">(dato real de Open-Meteo)</text>
<rect x="260" y="55" width="200" height="80" rx="10" fill="#f6eefb" stroke="#7a3ea1" stroke-width="2"/>
<text x="360.0" y="83.12" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#7a3ea1">climaDelDia(lluvia)</text>
<text x="360.0" y="99.62" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">si lluvia &gt; 0: lluvioso</text>
<text x="360.0" y="116.12" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">si no: templado</text>
<path d="M 212,95 L 258,95" stroke="#5b6876" stroke-width="2" fill="none" marker-end="url(#a-grey)"/>
<path d="M 462,95 L 508,95" stroke="#5b6876" stroke-width="2" fill="none" marker-end="url(#a-grey)"/>
<rect x="510" y="55" width="190" height="80" rx="10" fill="#fff4e5" stroke="#b45309" stroke-width="2"/>
<text x="605.0" y="83.12" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#b45309">temporada</text>
<text x="605.0" y="99.62" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">Tabla fija en el código</text>
<text x="605.0" y="116.12" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#17456f">cada producto y su clima</text>
<rect x="20" y="175" width="320" height="100" rx="10" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
<text x="180.0" y="212.76" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#17456f">templado</text>
<text x="180.0" y="229.76" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#17456f">Tomate chonto</text>
<text x="180.0" y="246.76" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#17456f">Aguacate hass</text>
<rect x="380" y="175" width="320" height="100" rx="10" fill="#f4faf7" stroke="#2e7d5b" stroke-width="2"/>
<text x="540.0" y="203.04" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#2e7d5b">lluvioso</text>
<text x="540.0" y="221.04" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#17456f">Papa criolla</text>
<text x="540.0" y="239.04" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#17456f">Panela</text>
<text x="540.0" y="257.03999999999996" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#17456f">Mora (disponible: false, sale por RN-04)</text>
<path d="M 605,137 L 605,173" stroke="#b45309" stroke-width="1.8" fill="none" marker-end="url(#a-orange)"/>
<path d="M 605,137 L 180,160 L 180,173" stroke="#b45309" stroke-width="1.8" fill="none" marker-end="url(#a-orange)"/>
<rect x="20" y="295" width="680" height="40" rx="8" fill="#fdf3f2" stroke="#a32d22" stroke-width="1.5"/>
<text x="360" y="320" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#a32d22">Simplificación didáctica: en el proyecto real, la temporada la calcula el servidor.</text>
</svg>
