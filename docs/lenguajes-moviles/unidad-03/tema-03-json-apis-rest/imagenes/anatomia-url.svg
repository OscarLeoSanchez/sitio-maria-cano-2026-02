<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="270" viewBox="0 0 720 270" role="img" aria-label="Anatomía de una URL: protocolo https, host api.open-meteo.com, ruta /v1/forecast y parámetros después del signo de interrogación" xmlns="http://www.w3.org/2000/svg">
<defs></defs>
<text x="360.0" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#17456f">Las partes de una URL</text>
<rect x="62.9" y="70" width="75.4" height="44" rx="8" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
<text x="100.6" y="98" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13.5" fill="#17456f">https://</text>
<path d="M 100.6,116 L 100.6,150" stroke="#17456f" stroke-width="1.5" fill="none"/>
<text x="100.6" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#17456f">protocolo</text>
<text x="100.6" y="188" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5b6876">cómo hablan</text>
<rect x="144.3" y="70" width="149.6" height="44" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="2"/>
<text x="219.1" y="98" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13.5" fill="#2e7d5b">api.open-meteo.com</text>
<path d="M 219.1,116 L 219.1,150" stroke="#2e7d5b" stroke-width="1.5" fill="none"/>
<text x="219.1" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#2e7d5b">host</text>
<text x="219.1" y="188" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5b6876">qué servidor</text>
<rect x="299.9" y="70" width="105.1" height="44" rx="8" fill="#f6eefb" stroke="#7a3ea1" stroke-width="2"/>
<text x="352.4" y="98" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13.5" fill="#7a3ea1">/v1/forecast</text>
<path d="M 352.4,116 L 352.4,150" stroke="#7a3ea1" stroke-width="1.5" fill="none"/>
<text x="352.4" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#7a3ea1">ruta</text>
<text x="352.4" y="188" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5b6876">qué pides</text>
<rect x="411.0" y="70" width="246.1" height="44" rx="8" fill="#fff4e5" stroke="#b45309" stroke-width="2"/>
<text x="534.0" y="98" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13.5" fill="#b45309">?latitude=6.17&amp;longitude=-75.58</text>
<path d="M 534.0,116 L 534.0,150" stroke="#b45309" stroke-width="1.5" fill="none"/>
<text x="534.0" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#b45309">parámetros</text>
<text x="534.0" y="188" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5b6876">los datos del pedido</text>
<text x="360" y="235" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6876">El signo ? separa la ruta de los parámetros; el &amp; separa un parámetro de otro.</text>
</svg>
