<?xml version="1.0" encoding="UTF-8"?>
<svg width="750" height="390" viewBox="0 0 750 390" role="img" aria-label="Comparacion entre StatelessWidget, que solo construye la interfaz con build y no guarda datos propios, y StatefulWidget, que crea un objeto State asociado que persiste, puede cambiar con setState y vuelve a ejecutar build sin perder los datos" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="flecha" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
    <marker id="flechaTeal" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0e8f8f"/>
    </marker>
  </defs>

  <line x1="370" y1="45" x2="370" y2="380" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>

  <text x="175" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#17456f">StatelessWidget</text>
  <text x="565" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#0e8f8f">StatefulWidget</text>

  <rect x="40" y="55" width="270" height="60" rx="8" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
  <text x="175" y="88" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13.5" font-weight="700" fill="#17456f">build(context)</text>
  <text x="175" y="105" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.8" fill="#17456f">usa los parametros recibidos</text>

  <path d="M 175,115 L 175,141" stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#flecha)"/>

  <rect x="40" y="145" width="270" height="54" rx="8" fill="#f3f5f8" stroke="#5b6876" stroke-width="2"/>
  <text x="175" y="177" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">interfaz en pantalla</text>

  <text x="175" y="230" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.2" fill="#5b6876">no tiene memoria propia:</text>
  <text x="175" y="247" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.2" fill="#5b6876">si algo cambia, Flutter crea un widget nuevo</text>

  <rect x="430" y="55" width="270" height="60" rx="8" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
  <text x="565" y="88" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13.5" font-weight="700" fill="#17456f">createState()</text>
  <text x="565" y="105" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.8" fill="#17456f">crea el objeto State la primera vez</text>

  <path d="M 565,115 L 565,141" stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#flecha)"/>

  <rect x="430" y="145" width="270" height="80" rx="8" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
  <text x="565" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0e8f8f">State&lt;MiWidget&gt;</text>
  <text x="565" y="189" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11.3" fill="#0b6b6c">datos mutables + build()</text>
  <text x="565" y="207" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.3" fill="#5b6876">persiste mientras el widget exista</text>

  <path d="M 700,158 L 725,158 L 725,212 L 700,212" stroke="#0e8f8f" stroke-width="1.8" fill="none" marker-end="url(#flechaTeal)"/>
  <text x="731" y="185" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="10" fill="#0e8f8f" transform="rotate(-90 731 185)">setState()</text>

  <path d="M 565,225 L 565,251" stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#flecha)"/>

  <rect x="430" y="255" width="270" height="54" rx="8" fill="#f3f5f8" stroke="#5b6876" stroke-width="2"/>
  <text x="565" y="287" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">interfaz en pantalla</text>

  <text x="565" y="340" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.2" fill="#5b6876">persiste mientras el widget viva:</text>
  <text x="565" y="357" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.2" fill="#5b6876">setState() repite build() sin perder los datos</text>
</svg>
