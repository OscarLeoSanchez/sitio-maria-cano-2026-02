<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="270" viewBox="0 0 720 270" role="img" aria-label="Tres formas de reutilizar codigo en Dart: extends para herencia de una sola superclase, implements para cumplir una interfaz y with para mezclar comportamiento con un mixin" xmlns="http://www.w3.org/2000/svg">
  <rect x="20" y="15" width="220" height="240" rx="8" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
  <rect x="260" y="15" width="220" height="240" rx="8" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
  <rect x="500" y="15" width="200" height="240" rx="8" fill="#fbecf2" stroke="#9b2c5e" stroke-width="2"/>

  <g font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="15" font-weight="700">
    <text x="38" y="42" fill="#17456f">extends</text>
    <text x="278" y="42" fill="#0e8f8f">implements</text>
    <text x="518" y="42" fill="#9b2c5e">with</text>
  </g>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5b6876">
    <text x="38" y="62">hereda de una sola</text>
    <text x="38" y="76">superclase</text>

    <text x="278" y="62">se compromete a</text>
    <text x="278" y="76">implementarlo todo</text>

    <text x="518" y="62">mezcla metodos,</text>
    <text x="518" y="76">no es el padre</text>
  </g>

  <line x1="38" y1="88" x2="222" y2="88" stroke="#e8edf3" stroke-width="1"/>
  <line x1="278" y1="88" x2="462" y2="88" stroke="#e8edf3" stroke-width="1"/>
  <line x1="518" y1="88" x2="682" y2="88" stroke="#e8edf3" stroke-width="1"/>

  <g font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11.3" fill="#5b6876">
    <text x="38" y="112">class Perro</text>
    <text x="38" y="128" fill="#17456f" font-weight="700">extends</text>
    <text x="93" y="128">Animal {</text>
    <text x="38" y="144" fill="#94a3b8">  @override</text>
    <text x="38" y="160">  void moverse()</text>
    <text x="38" y="176">    {...}</text>
    <text x="38" y="192">}</text>

    <text x="278" y="105">class Pato </text>
    <text x="357" y="105" fill="#0e8f8f" font-weight="700">implements</text>
    <text x="278" y="121">  Volador, Nadador {</text>
    <text x="278" y="137" fill="#94a3b8">  @override</text>
    <text x="278" y="153">  void volar() {...}</text>
    <text x="278" y="169" fill="#94a3b8">  @override</text>
    <text x="278" y="185">  void nadar() {...}</text>

    <text x="518" y="105">class Heroe extends</text>
    <text x="518" y="121">  Personaje </text>
    <text x="578" y="121" fill="#9b2c5e" font-weight="700">with</text>
    <text x="518" y="137">  Volador, Invisible {</text>
    <text x="518" y="161" fill="#94a3b8">  // usa metodos de</text>
    <text x="518" y="177" fill="#94a3b8">  // los dos mixins</text>
    <text x="518" y="193">}</text>
  </g>
</svg>
