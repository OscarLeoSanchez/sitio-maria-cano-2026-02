<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="260" viewBox="0 0 720 260" role="img" aria-label="Flujo de async y await en Dart: se llama la funcion, llega a un await, el control vuelve al llamador sin bloquear, el Future se completa, la funcion continua justo despues del await y retorna el resultado" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="flecha9" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <g stroke="#94a3b8" stroke-width="1.6" fill="none">
    <path d="M 130,60 L 330,60" marker-end="url(#flecha9)"/>
    <path d="M 400,60 L 600,60" marker-end="url(#flecha9)"/>
    <path d="M 650,86 L 650,174" marker-end="url(#flecha9)" stroke-dasharray="4 3"/>
    <path d="M 600,200 L 400,200" marker-end="url(#flecha9)"/>
    <path d="M 330,200 L 130,200" marker-end="url(#flecha9)"/>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <circle cx="90" cy="60" r="24" fill="#17456f" stroke="#17456f" stroke-width="1.5"/>
    <text x="90" y="66" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="16" font-weight="700" fill="#ffffff">1</text>
    <text x="90" y="102" font-size="11.3" fill="#5b6876">se llama la</text>
    <text x="90" y="116" font-size="11.3" fill="#5b6876">funcion async</text>

    <circle cx="365" cy="60" r="24" fill="#17456f" stroke="#17456f" stroke-width="1.5"/>
    <text x="365" y="66" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="16" font-weight="700" fill="#ffffff">2</text>
    <text x="365" y="102" font-size="11.3" fill="#5b6876">llega a un</text>
    <text x="365" y="116" font-size="11.3" fill="#5b6876">await</text>

    <circle cx="650" cy="60" r="24" fill="#0e8f8f" stroke="#0e8f8f" stroke-width="1.5"/>
    <text x="650" y="66" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="16" font-weight="700" fill="#ffffff">3</text>
    <text x="650" y="102" font-size="11.3" fill="#5b6876">el control vuelve</text>
    <text x="650" y="116" font-size="11.3" fill="#5b6876">al llamador</text>

    <circle cx="650" cy="200" r="24" fill="#0e8f8f" stroke="#0e8f8f" stroke-width="1.5"/>
    <text x="650" y="206" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="16" font-weight="700" fill="#ffffff">4</text>
    <text x="650" y="236" font-size="11.3" fill="#5b6876">el Future se</text>
    <text x="650" y="250" font-size="11.3" fill="#5b6876">completa</text>

    <circle cx="365" cy="200" r="24" fill="#9b2c5e" stroke="#9b2c5e" stroke-width="1.5"/>
    <text x="365" y="206" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="16" font-weight="700" fill="#ffffff">5</text>
    <text x="365" y="236" font-size="11.3" fill="#5b6876">continua tras</text>
    <text x="365" y="250" font-size="11.3" fill="#5b6876">el await</text>

    <circle cx="90" cy="200" r="24" fill="#9b2c5e" stroke="#9b2c5e" stroke-width="1.5"/>
    <text x="90" y="206" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="16" font-weight="700" fill="#ffffff">6</text>
    <text x="90" y="236" font-size="11.3" fill="#5b6876">retorna el</text>
    <text x="90" y="250" font-size="11.3" fill="#5b6876">resultado</text>
  </g>
</svg>
