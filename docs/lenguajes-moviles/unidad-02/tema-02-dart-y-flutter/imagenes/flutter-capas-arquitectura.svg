<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="450" viewBox="0 0 680 450" role="img" aria-label="Arquitectura en capas de Flutter: el framework en Dart arriba, el engine en C++ que es el motor de renderizado en el medio, el embedder especifico de cada plataforma (Android, iOS, Windows, macOS, Linux, Web) debajo, y el sistema operativo o navegador como base" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="flechaCapa" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="30" y="20" width="620" height="70" rx="8" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
  <rect x="30" y="116" width="620" height="70" rx="8" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
  <rect x="30" y="212" width="620" height="100" rx="8" fill="#fbecf2" stroke="#9b2c5e" stroke-width="2"/>
  <rect x="30" y="338" width="620" height="70" rx="8" fill="#f3f5f8" stroke="#5b6876" stroke-width="2"/>

  <g stroke="#94a3b8" stroke-width="1.6" fill="none">
    <path d="M 340,90 L 340,112" marker-end="url(#flechaCapa)"/>
    <path d="M 340,186 L 340,208" marker-end="url(#flechaCapa)"/>
    <path d="M 340,312 L 340,334" marker-end="url(#flechaCapa)"/>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="50" y="50" font-size="14.5" font-weight="700" fill="#17456f">Framework (Dart)</text>
    <text x="50" y="70" font-size="11.5" fill="#5b6876">widgets, Material y Cupertino, gestion de estado: el codigo que escribe el desarrollador</text>

    <text x="50" y="146" font-size="14.5" font-weight="700" fill="#0e8f8f">Engine (C++)</text>
    <text x="50" y="166" font-size="11.5" fill="#5b6876">motor de renderizado: dibuja graficos, texto y animaciones con Skia o Impeller</text>

    <text x="50" y="234" font-size="13.5" font-weight="700" fill="#9b2c5e">Embedder (especifico de cada plataforma)</text>

    <text x="50" y="368" font-size="14.5" font-weight="700" fill="#334155">Sistema operativo / navegador</text>
    <text x="50" y="388" font-size="11.5" fill="#5b6876">Android, iOS, Windows, macOS, Linux, o el navegador en Flutter Web</text>
  </g>

  <g>
    <rect x="50" y="252" width="90" height="50" rx="6" fill="#ffffff" stroke="#9b2c5e" stroke-width="1.5"/>
    <rect x="148" y="252" width="90" height="50" rx="6" fill="#ffffff" stroke="#9b2c5e" stroke-width="1.5"/>
    <rect x="246" y="252" width="90" height="50" rx="6" fill="#ffffff" stroke="#9b2c5e" stroke-width="1.5"/>
    <rect x="344" y="252" width="90" height="50" rx="6" fill="#ffffff" stroke="#9b2c5e" stroke-width="1.5"/>
    <rect x="442" y="252" width="90" height="50" rx="6" fill="#ffffff" stroke="#9b2c5e" stroke-width="1.5"/>
    <rect x="540" y="252" width="90" height="50" rx="6" fill="#ffffff" stroke="#9b2c5e" stroke-width="1.5"/>
  </g>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#9b2c5e" text-anchor="middle">
    <text x="95" y="281">Android</text>
    <text x="193" y="281">iOS</text>
    <text x="291" y="281">Windows</text>
    <text x="389" y="281">macOS</text>
    <text x="487" y="281">Linux</text>
    <text x="585" y="281">Web</text>
  </g>

  <text x="340" y="430" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#94a3b8">cada capa depende de la de abajo: el framework no sabe en que sistema operativo corre</text>
</svg>
