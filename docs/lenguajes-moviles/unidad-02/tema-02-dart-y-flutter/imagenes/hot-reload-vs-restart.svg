<?xml version="1.0" encoding="UTF-8"?>
<svg width="520" height="390" viewBox="0 0 520 390" role="img" aria-label="Comparacion entre hot reload con la tecla r, que inyecta el codigo nuevo y conserva el estado, hot restart con la tecla R mayuscula, que reinicia el estado, y la tecla q para detener la app" xmlns="http://www.w3.org/2000/svg">
  <rect x="20" y="20" width="460" height="50" rx="8" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
  <rect x="20" y="150" width="460" height="50" rx="8" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
  <rect x="20" y="280" width="460" height="50" rx="8" fill="#f3f5f8" stroke="#5b6876" stroke-width="2"/>

  <g font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="26" font-weight="700">
    <text x="42" y="57" fill="#0e8f8f">r</text>
    <text x="42" y="187" fill="#17456f">R</text>
    <text x="42" y="317" fill="#5b6876">q</text>
  </g>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" fill="#334155">
    <text x="82" y="55">hot reload</text>
    <text x="82" y="185">hot restart</text>
    <text x="82" y="315">detener la app</text>
  </g>

  <g stroke-width="2.2" fill="none">
    <path d="M 42,82 L 63,82" stroke="#0e8f8f"/>
    <path d="M 42,212 L 63,212" stroke="#17456f"/>
    <path d="M 42,342 L 63,342" stroke="#5b6876"/>
  </g>
  <g stroke-width="1.1" fill="none" stroke-dasharray="3 3">
    <path d="M 52,84 L 52,96" stroke="#0e8f8f"/>
    <path d="M 52,214 L 52,226" stroke="#17456f"/>
    <path d="M 52,344 L 52,356" stroke="#5b6876"/>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#5b6876">
    <text x="20" y="111">conserva el estado, tarda menos de un segundo</text>
    <text x="20" y="241">reinicia el estado, tarda unos segundos</text>
    <text x="20" y="371">cierra la app y vuelve a la terminal</text>
  </g>
</svg>
