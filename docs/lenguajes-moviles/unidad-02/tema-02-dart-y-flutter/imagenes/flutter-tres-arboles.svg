<?xml version="1.0" encoding="UTF-8"?>
<svg width="950" height="540" viewBox="0 0 950 540" role="img" aria-label="Los tres arboles paralelos de Flutter en una cadena de un solo hijo cada uno: Center envuelve a Padding, Padding envuelve a MiWidget y MiWidget envuelve a Icon. El arbol de widgets y el de elements tienen los cuatro nodos, porque todo widget genera un element. El arbol de render objects solo tiene tres: Center, Padding e Icon, porque MiWidget es un StatelessWidget y no crea render object propio, asi que el render object de Icon se conecta directo con el de Padding, su ancestro mas cercano que si tiene uno" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="flecha-arboles" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
    <marker id="flecha-arboles-tenue" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c3ccd9"/>
    </marker>
  </defs>

  <text x="150" y="38" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#17456f">Widget tree</text>
  <text x="470" y="38" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#0e8f8f">Element tree</text>
  <text x="790" y="38" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#9b2c5e">RenderObject tree</text>

  <!-- Lineas verticales de cada arbol: cadena de un solo hijo, sin ramas -->
  <g stroke="#c3ccd9" stroke-width="1.4" fill="none">
    <path d="M 150,107 L 150,183"/>
    <path d="M 150,217 L 150,293"/>
    <path d="M 150,327 L 150,403"/>

    <path d="M 470,107 L 470,183"/>
    <path d="M 470,217 L 470,293"/>
    <path d="M 470,327 L 470,403"/>

    <path d="M 790,107 L 790,183"/>
    <path d="M 790,217 L 790,403"/>
  </g>

  <!-- Flechas horizontales widget -> element -> render object, fila por fila -->
  <g stroke="#94a3b8" stroke-width="1.6" fill="none">
    <path d="M 202,90 L 418,90" marker-end="url(#flecha-arboles)"/>
    <path d="M 522,90 L 738,90" marker-end="url(#flecha-arboles)"/>

    <path d="M 202,200 L 418,200" marker-end="url(#flecha-arboles)"/>
    <path d="M 522,200 L 738,200" marker-end="url(#flecha-arboles)"/>

    <path d="M 202,310 L 418,310" marker-end="url(#flecha-arboles)"/>

    <path d="M 202,420 L 418,420" marker-end="url(#flecha-arboles)"/>
    <path d="M 522,420 L 738,420" marker-end="url(#flecha-arboles)"/>
  </g>

  <!-- Fila 3, columna Element -> RenderObject: la asignacion se corta aqui, no llega a crear caja -->
  <path d="M 522,310 L 606,310" stroke="#c3ccd9" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#flecha-arboles-tenue)"/>

  <!-- Columna Widget tree -->
  <g font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13" font-weight="700" text-anchor="middle">
    <rect x="98" y="73" width="104" height="34" rx="6" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
    <text x="150" y="95" fill="#17456f">Center</text>

    <rect x="98" y="183" width="104" height="34" rx="6" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
    <text x="150" y="205" fill="#17456f">Padding</text>

    <rect x="98" y="293" width="104" height="34" rx="6" fill="#eef3fb" stroke="#17456f" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="150" y="315" fill="#17456f">MiWidget</text>

    <rect x="98" y="403" width="104" height="34" rx="6" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
    <text x="150" y="425" fill="#17456f">Icon</text>
  </g>

  <!-- Columna Element tree -->
  <g font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13" font-weight="700" text-anchor="middle">
    <rect x="418" y="73" width="104" height="34" rx="6" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
    <text x="470" y="95" fill="#0e8f8f">Center</text>

    <rect x="418" y="183" width="104" height="34" rx="6" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
    <text x="470" y="205" fill="#0e8f8f">Padding</text>

    <rect x="418" y="293" width="104" height="34" rx="6" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="470" y="315" fill="#0e8f8f">MiWidget</text>

    <rect x="418" y="403" width="104" height="34" rx="6" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="2"/>
    <text x="470" y="425" fill="#0e8f8f">Icon</text>
  </g>

  <!-- Columna RenderObject tree: solo tres cajas reales, la fila 3 queda como hueco -->
  <g font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13" font-weight="700" text-anchor="middle">
    <rect x="738" y="73" width="104" height="34" rx="6" fill="#fbecf2" stroke="#9b2c5e" stroke-width="2"/>
    <text x="790" y="95" fill="#9b2c5e">Center</text>

    <rect x="738" y="183" width="104" height="34" rx="6" fill="#fbecf2" stroke="#9b2c5e" stroke-width="2"/>
    <text x="790" y="205" fill="#9b2c5e">Padding</text>

    <!-- Hueco fantasma: aqui no hay render object, la linea de Padding a Icon pasa de largo -->
    <rect x="738" y="293" width="104" height="34" rx="6" fill="none" stroke="#c9d3e0" stroke-width="1.6" stroke-dasharray="4 4"/>
    <text x="790" y="313" font-size="10.5" font-weight="700" fill="#aab4c4">MiWidget</text>
    <text x="790" y="324" font-size="8.5" font-weight="400" font-style="italic" fill="#aab4c4">sin render object</text>

    <rect x="738" y="403" width="104" height="34" rx="6" fill="#fbecf2" stroke="#9b2c5e" stroke-width="2"/>
    <text x="790" y="425" fill="#9b2c5e">Icon</text>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-style="italic" fill="#94a3b8" text-anchor="start">
    <text x="855" y="304" font-size="10">(MiWidget)</text>
    <text x="855" y="318" font-size="10">no crea render object</text>

    <text x="855" y="352" font-size="10">Icon se conecta</text>
    <text x="855" y="366" font-size="10">directo con el render</text>
    <text x="855" y="380" font-size="10">object de Padding</text>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-style="italic" fill="#94a3b8" text-anchor="middle">
    <text x="475" y="480" font-size="11.5">Cada widget crea un element; solo los elements de tipo render crean un render object.</text>
    <text x="475" y="497" font-size="11.5">MiWidget no tiene render object propio: Icon se conecta directo con el de Padding, su ancestro mas cercano que si tiene uno.</text>
  </g>
</svg>
