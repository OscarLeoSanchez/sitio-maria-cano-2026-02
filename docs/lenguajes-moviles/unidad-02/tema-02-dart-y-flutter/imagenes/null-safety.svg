    <text x="79" y="90" fill="#237a3f">nunca es null</text>
    <text x="466" y="90" fill="#b8730f">puede ser null</text>
  </g>

  <line x1="20" y1="112" x2="740" y2="112" stroke="#e8edf3" stroke-width="1"/>

  <rect x="20" y="132" width="165" height="36" rx="7" fill="#eef3fb" stroke="#17456f" stroke-width="1.6"/>
  <rect x="205" y="132" width="175" height="36" rx="7" fill="#eef3fb" stroke="#17456f" stroke-width="1.6"/>
  <rect x="400" y="132" width="165" height="36" rx="7" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="1.6"/>
  <rect x="585" y="132" width="155" height="36" rx="7" fill="#fbecf2" stroke="#9b2c5e" stroke-width="1.6"/>

  <g font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13.5">
    <text x="34" y="155" fill="#334155">nombre </text>
    <text x="102" y="155" fill="#17456f" font-weight="700">??</text>
    <text x="122" y="155" fill="#334155"> "inv."</text>

    <text x="219" y="155" fill="#334155">nombre </text>
    <text x="287" y="155" fill="#17456f" font-weight="700">??=</text>
    <text x="319" y="155" fill="#334155"> "inv."</text>

    <text x="414" y="155" fill="#334155">usuario</text>
    <text x="482" y="155" fill="#0e8f8f" font-weight="700">?.</text>
    <text x="500" y="155" fill="#334155">nombre</text>

    <text x="599" y="155" fill="#334155">nombre</text>
    <text x="661" y="155" fill="#9b2c5e" font-weight="700">!</text>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.6" text-anchor="middle" fill="#5b6876">
    <text x="102" y="195">defecto si es null</text>
    <text x="292" y="195">asigna si era null</text>
    <text x="482" y="195">llama si no es null</text>
