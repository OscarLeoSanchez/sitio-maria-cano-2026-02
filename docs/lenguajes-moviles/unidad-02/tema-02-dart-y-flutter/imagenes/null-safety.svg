<?xml version="1.0" encoding="UTF-8"?>
<svg width="760" height="230" viewBox="0 0 760 230" role="img" aria-label="Null safety en Dart: String nombre nunca es null, String interrogacion nombre puede ser null, y los operadores doble interrogacion, doble interrogacion igual, interrogacion punto y signo de admiracion para trabajar con valores que pueden ser null" xmlns="http://www.w3.org/2000/svg">
  <rect x="20" y="16" width="340" height="42" rx="8" fill="#eaf7ee" stroke="#237a3f" stroke-width="2"/>
  <rect x="400" y="16" width="340" height="42" rx="8" fill="#fdf3e7" stroke="#b8730f" stroke-width="2"/>

  <g font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="20">
    <text x="42" y="44" fill="#237a3f" font-weight="700">String</text>
    <text x="122" y="44" fill="#334155"> nombre</text>

    <text x="422" y="44" fill="#b8730f" font-weight="700">String?</text>
    <text x="516" y="44" fill="#334155"> nombre</text>
  </g>

  <g stroke-width="2.2" fill="none">
    <path d="M 42,64 L 116,64" stroke="#237a3f"/>
    <path d="M 422,64 L 510,64" stroke="#b8730f"/>
  </g>
