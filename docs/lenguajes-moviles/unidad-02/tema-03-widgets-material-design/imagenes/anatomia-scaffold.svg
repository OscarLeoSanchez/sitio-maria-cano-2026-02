<?xml version="1.0" encoding="UTF-8"?>
<svg width="620" height="460" viewBox="0 0 620 460" role="img" aria-label="Anatomía de un Scaffold: appBar arriba, body en el centro, floatingActionButton flotando sobre la esquina inferior derecha del body, bottomNavigationBar abajo, y un drawer oculto que se desliza desde el borde izquierdo" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="flechaScaffold" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b45309"/>
    </marker>
  </defs>

  <text x="204" y="20" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#17456f">Scaffold</text>

  <rect x="30" y="90" width="150" height="260" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="105" y="112" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b45309">drawer</text>
  <text x="105" y="130" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.3" fill="#8a4a15">oculto por</text>
  <text x="105" y="144" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.3" fill="#8a4a15">defecto</text>
  <path d="M 180,220 L 200,220" stroke="#b45309" stroke-width="1.6" fill="none" marker-end="url(#flechaScaffold)"/>

  <rect x="200" y="20" width="200" height="420" rx="22" fill="#ffffff" stroke="#17456f" stroke-width="2.5"/>

  <rect x="204" y="44" width="192" height="46" fill="#eef3fb" stroke="#17456f" stroke-width="1.6"/>
  <text x="300" y="71" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12" fill="#17456f">appBar</text>

  <rect x="204" y="90" width="192" height="260" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="300" y="224" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12" fill="#5b6876">body</text>

  <circle cx="372" cy="340" r="20" fill="#fbecf2" stroke="#9b2c5e" stroke-width="2"/>
  <text x="372" y="344" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#9b2c5e">+</text>

  <rect x="204" y="350" width="192" height="46" fill="#e7f7f7" stroke="#0e8f8f" stroke-width="1.6"/>
  <text x="300" y="377" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#0e8f8f">bottomNavigationBar</text>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5">
    <path d="M 396,67 L 460,67" stroke="#17456f" stroke-width="1.3" fill="none"/>
    <text x="464" y="63" fill="#17456f" font-weight="700">AppBar</text>
    <text x="464" y="78" fill="#5b6876" font-size="11">title, actions, leading</text>

    <path d="M 396,220 L 460,220" stroke="#5b6876" stroke-width="1.3" fill="none"/>
    <text x="464" y="216" fill="#5b6876" font-weight="700">body</text>
    <text x="464" y="231" fill="#5b6876" font-size="11">el contenido de tu pantalla</text>

    <path d="M 392,340 L 460,340" stroke="#9b2c5e" stroke-width="1.3" fill="none"/>
    <text x="464" y="336" fill="#9b2c5e" font-weight="700">floatingActionButton</text>
    <text x="464" y="351" fill="#5b6876" font-size="11">flota sobre el body</text>

    <path d="M 396,373 L 460,373" stroke="#0e8f8f" stroke-width="1.3" fill="none"/>
    <text x="464" y="369" fill="#0e8f8f" font-weight="700">bottomNavigationBar</text>
    <text x="464" y="384" fill="#5b6876" font-size="11">barra fija abajo</text>
  </g>

  <text x="310" y="440" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#94a3b8">appBar, body, floatingActionButton, bottomNavigationBar y drawer son parámetros con nombre de Scaffold</text>
</svg>
