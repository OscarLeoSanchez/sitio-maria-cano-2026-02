<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 773 402" width="773" height="402" role="img" aria-labelledby="t d">
<title id="t">Símbolo del sistema</title>
<desc id="d">Salida de ejemplo de curl -v http://example.com con cinco puntos resaltados: la resolución del nombre, la conexión establecida con los puertos, la línea de petición GET, la cabecera Host y la línea de estado de la respuesta</desc>
