<g font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="13" fill="#cccccc">
<text x="18" y="63" textLength="316.0" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">C:\Users\ana&gt; curl -v http://example.com</text>
<text x="18" y="83" textLength="276.5" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">* Host example.com:80 was resolved.</text>
<text x="18" y="103" textLength="110.6" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">* IPv6: (none)</text>
<text x="18" y="123" textLength="268.6" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">* IPv4: 203.0.113.10, 203.0.113.11</text>
<text x="18" y="143" textLength="229.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">*   Trying 203.0.113.10:80...</text>
<text x="18" y="163" textLength="703.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">* Established connection to example.com (203.0.113.10 port 80) from 192.0.2.20 port 50312</text>
<text x="18" y="183" textLength="126.4" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">* using HTTP/1.x</text>
<text x="18" y="203" textLength="126.4" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">&gt; GET / HTTP/1.1</text>
<text x="18" y="223" textLength="150.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">&gt; Host: example.com</text>
<text x="18" y="243" textLength="197.5" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">&gt; User-Agent: curl/8.21.0</text>
<text x="18" y="263" textLength="102.7" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">&gt; Accept: */*</text>
<text x="18" y="283" textLength="7.9" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">&gt;</text>
<text x="18" y="303" textLength="229.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">* Request completely sent off</text>
<text x="18" y="323" textLength="134.3" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">&lt; HTTP/1.1 200 OK</text>
<text x="18" y="343" textLength="292.3" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">&lt; Date: Mon, 26 Oct 2026 04:26:42 GMT</text>
<text x="18" y="363" textLength="316.0" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">&lt; Content-Type: text/html; charset=utf-8</text>
<text x="18" y="383" textLength="221.2" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">&lt; Transfer-Encoding: chunked</text>
</g>
