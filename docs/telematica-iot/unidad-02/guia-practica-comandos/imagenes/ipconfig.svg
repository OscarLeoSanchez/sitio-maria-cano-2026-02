<title id="t">Símbolo del sistema</title>
<desc id="d">Salida de ejemplo de ipconfig /all con cinco datos resaltados y numerados: la dirección física, la dirección IPv4, la máscara de subred, la puerta de enlace predeterminada y los servidores DNS</desc>
