<g font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="13" fill="#cccccc">
<text x="18" y="63" textLength="213.3" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">C:\Users\ana&gt; ipconfig /all</text>
<text x="18" y="103" textLength="244.9" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Adaptador de Ethernet Ethernet:</text>
<text x="18" y="143" textLength="616.2" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">   Descripción . . . . . . . . . . . . . . . : Controlador Ethernet de ejemplo</text>
<text x="18" y="163" textLength="505.6" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">   Dirección física. . . . . . . . . . . . . : 00-00-5E-00-53-0A</text>
<text x="18" y="183" textLength="387.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">   DHCP habilitado . . . . . . . . . . . . . : sí</text>
<text x="18" y="203" textLength="537.2" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">   Dirección IPv4. . . . . . . . . . . . . . : 192.0.2.20(Preferido)</text>
<text x="18" y="223" textLength="474.0" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">   Máscara de subred . . . . . . . . . . . . : 255.255.255.0</text>
<text x="18" y="243" textLength="442.4" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">   Puerta de enlace predeterminada . . . . . : 192.0.2.1</text>
<text x="18" y="263" textLength="442.4" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">   Servidor DHCP . . . . . . . . . . . . . . : 192.0.2.1</text>
<text x="18" y="283" textLength="450.3" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">   Servidores DNS. . . . . . . . . . . . . . : 192.0.2.53</text>
</g>
