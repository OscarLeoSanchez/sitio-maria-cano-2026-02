<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 559 222" width="559" height="222" role="img" aria-labelledby="t d">
<title id="t">Windows PowerShell</title>
<desc id="d">Salida de ejemplo de verificador.py con un plan a medias: dos grupos caben, uno no cabe y uno está sin llenar</desc>
<g transform="translate(0,0)">
<rect width="559" height="222" rx="10" fill="#012456"/>
