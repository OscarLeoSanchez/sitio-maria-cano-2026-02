<g font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="13" fill="#eeedf0">
<text x="18" y="63" textLength="379.2" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PS C:\Users\estudiante\u3&gt; python verificador.py</text>
<text x="18" y="83" textLength="489.8" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">sensores -&gt; no cabe: tiene lugar para 30 equipos y necesita 60</text>
<text x="18" y="103" textLength="173.8" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">administracion -&gt; cabe</text>
<text x="18" y="123" textLength="189.6" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">servidores -&gt; sin llenar</text>
<text x="18" y="143" textLength="110.6" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">enlace -&gt; cabe</text>
<text x="18" y="163" textLength="323.9" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Direcciones del laboratorio sin usar: 220</text>
<text x="18" y="183" textLength="418.7" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Lugares de equipo que sobran dentro de tus bloques: 5</text>
<text x="18" y="203" textLength="237.0" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Plan completo: todavia no cabe</text>
</g>
