<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 504 282" width="504" height="282" role="img" aria-labelledby="t d">
<title id="t">Windows PowerShell</title>
<desc id="d">Salida de ejemplo de ping a un equipo que no contesta: cuatro avisos de tiempo de espera agotado y el resumen con cero paquetes recibidos</desc>
<g transform="translate(0,0)">
<rect width="504" height="282" rx="10" fill="#012456"/>
<path d="M0,10 a10,10 0 0 1 10,-10 H494 a10,10 0 0 1 10,10 V34 H0 Z" fill="#2b2b2b"/>
<text x="14" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#e6e6e6">Windows PowerShell</text>
<g stroke="#bbbbbb" stroke-width="1.4" fill="none"><path d="M408,17 h10"/><rect x="442" y="12" width="10" height="10"/><path d="M476,12 l10,10 M486,12 l-10,10"/></g>
<rect x="16.0" y="110" width="359.5" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<rect x="237.2" y="230" width="106.7" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<g font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="13" fill="#eeedf0">
<text x="18" y="63" textLength="355.5" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PS C:\Users\estudiante\u3&gt; ping 192.168.10.45</text>
<text x="18" y="103" textLength="410.8" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Haciendo ping a 192.168.10.45 con 32 bytes de datos:</text>
<text x="18" y="123" textLength="355.5" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Tiempo de espera agotado para esta solicitud.</text>
<text x="18" y="143" textLength="355.5" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Tiempo de espera agotado para esta solicitud.</text>
<text x="18" y="163" textLength="355.5" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Tiempo de espera agotado para esta solicitud.</text>
<text x="18" y="183" textLength="355.5" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Tiempo de espera agotado para esta solicitud.</text>
<text x="18" y="223" textLength="316.0" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Estadísticas de ping para 192.168.10.45:</text>
<text x="18" y="243" textLength="434.5" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">    Paquetes: enviados = 4, recibidos = 0, perdidos = 4</text>
<text x="18" y="263" textLength="158.0" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">    (100% perdidos),</text>
</g>
<circle cx="385.5" cy="111.0" r="9.5" fill="#f2b33d" stroke="#012456" stroke-width="1.5"/>
<text x="385.5" y="115.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2a24">1</text>
<circle cx="353.9" cy="231.0" r="9.5" fill="#f2b33d" stroke="#012456" stroke-width="1.5"/>
<text x="353.9" y="235.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2a24">2</text>
</g>
