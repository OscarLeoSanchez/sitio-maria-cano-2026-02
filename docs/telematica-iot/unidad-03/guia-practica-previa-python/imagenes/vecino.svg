<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 462" width="670" height="462" role="img" aria-labelledby="t d">
<title id="t">Windows PowerShell</title>
<desc id="d">Salida de vecino.py con dos pares de equipos y la máscara de 26 unos: el primer par da el mismo resultado y el segundo par da resultados distintos</desc>
<g transform="translate(0,0)">
<rect width="670" height="462" rx="10" fill="#012456"/>
<path d="M0,10 a10,10 0 0 1 10,-10 H660 a10,10 0 0 1 10,10 V34 H0 Z" fill="#2b2b2b"/>
<text x="14" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#e6e6e6">Windows PowerShell</text>
<g stroke="#bbbbbb" stroke-width="1.4" fill="none"><path d="M574,17 h10"/><rect x="608" y="12" width="10" height="10"/><path d="M642,12 l10,10 M652,12 l-10,10"/></g>
<rect x="205.6" y="130" width="280.5" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<rect x="490.0" y="170" width="114.6" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<rect x="16.0" y="230" width="122.5" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<rect x="490.0" y="390" width="122.5" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<rect x="16.0" y="410" width="146.2" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<g font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="13" fill="#eeedf0">
<text x="18" y="63" textLength="339.7" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PS C:\Users\estudiante\u3&gt; python vecino.py</text>
<text x="18" y="83" textLength="387.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Mascara (por ejemplo 26; Enter para terminar): 26</text>
<text x="18" y="103" textLength="181.7" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Equipo 1: 192.168.10.20</text>
<text x="18" y="123" textLength="181.7" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Equipo 2: 192.168.10.45</text>
<text x="18" y="143" textLength="466.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Mascara:                11111111.11111111.11111111.11000000</text>
<text x="18" y="163" textLength="466.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Equipo 1:               11000000.10101000.00001010.00010100</text>
<text x="18" y="183" textLength="584.6" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Equipo 1 AND mascara:   11000000.10101000.00001010.00000000 = 192.168.10.0</text>
<text x="18" y="203" textLength="466.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Equipo 2:               11000000.10101000.00001010.00101101</text>
<text x="18" y="223" textLength="584.6" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Equipo 2 AND mascara:   11000000.10101000.00001010.00000000 = 192.168.10.0</text>
<text x="18" y="243" textLength="418.7" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Resultado igual: son vecinos, se hablan directamente.</text>
<text x="18" y="263" textLength="387.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Mascara (por ejemplo 26; Enter para terminar): 26</text>
<text x="18" y="283" textLength="181.7" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Equipo 1: 192.168.10.20</text>
<text x="18" y="303" textLength="181.7" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Equipo 2: 192.168.10.70</text>
<text x="18" y="323" textLength="466.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Mascara:                11111111.11111111.11111111.11000000</text>
<text x="18" y="343" textLength="466.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Equipo 1:               11000000.10101000.00001010.00010100</text>
<text x="18" y="363" textLength="584.6" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Equipo 1 AND mascara:   11000000.10101000.00001010.00000000 = 192.168.10.0</text>
<text x="18" y="383" textLength="466.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Equipo 2:               11000000.10101000.00001010.01000110</text>
<text x="18" y="403" textLength="592.5" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Equipo 2 AND mascara:   11000000.10101000.00001010.01000000 = 192.168.10.64</text>
<text x="18" y="423" textLength="600.4" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Resultado distinto: no son vecinos, el mensaje sale por la puerta de enlace.</text>
<text x="18" y="443" textLength="363.4" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Mascara (por ejemplo 26; Enter para terminar):</text>
</g>
