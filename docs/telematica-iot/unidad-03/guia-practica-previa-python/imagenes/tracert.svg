<text x="638.3" y="175.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2a24">2</text>
<circle cx="338.1" cy="231.0" r="9.5" fill="#f2b33d" stroke="#012456" stroke-width="1.5"/>
<text x="338.1" y="235.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2a24">3</text>
</g>
