<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 678 302" width="678" height="302" role="img" aria-labelledby="t d">
<title id="t">Windows PowerShell</title>
<desc id="d">Salida de ejemplo de tracert -d -h 8 -w 1000 8.8.8.8: seis saltos, el primero por la puerta de salida del laboratorio y el último en 8.8.8.8</desc>
<g transform="translate(0,0)">
<rect width="678" height="302" rx="10" fill="#012456"/>
<path d="M0,10 a10,10 0 0 1 10,-10 H668 a10,10 0 0 1 10,10 V34 H0 Z" fill="#2b2b2b"/>
<text x="14" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#e6e6e6">Windows PowerShell</text>
<g stroke="#bbbbbb" stroke-width="1.4" fill="none"><path d="M582,17 h10"/><rect x="616" y="12" width="10" height="10"/><path d="M650,12 l10,10 M660,12 l-10,10"/></g>
<rect x="268.8" y="130" width="98.8" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<rect x="268.8" y="170" width="359.5" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<rect x="268.8" y="230" width="59.3" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<g font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="13" fill="#eeedf0">
<text x="18" y="63" textLength="458.2" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PS C:\Users\estudiante\u3&gt; tracert -d -h 8 -w 1000 8.8.8.8</text>
<text x="18" y="103" textLength="426.6" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Traza a 8.8.8.8 sobre caminos de 8 saltos como máximo.</text>
<text x="18" y="143" textLength="355.5" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">  1    &lt;1 ms    &lt;1 ms    &lt;1 ms  192.168.10.1 </text>
<text x="18" y="163" textLength="355.5" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">  2     5 ms     4 ms     3 ms  198.51.100.1 </text>
<text x="18" y="183" textLength="608.3" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">  3     *        *        *     Tiempo de espera agotado para esta solicitud.</text>
<text x="18" y="203" textLength="347.6" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">  4    11 ms    10 ms    11 ms  203.0.113.9 </text>
<text x="18" y="223" textLength="355.5" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">  5    11 ms    11 ms    13 ms  203.0.113.10 </text>
<text x="18" y="243" textLength="316.0" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">  6    12 ms    12 ms    12 ms  8.8.8.8 </text>
<text x="18" y="283" textLength="118.5" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Traza completa.</text>
</g>
<circle cx="377.6" cy="131.0" r="9.5" fill="#f2b33d" stroke="#012456" stroke-width="1.5"/>
<text x="377.6" y="135.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2a24">1</text>
