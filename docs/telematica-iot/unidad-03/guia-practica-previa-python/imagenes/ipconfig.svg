<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 559 262" width="559" height="262" role="img" aria-labelledby="t d">
<title id="t">Windows PowerShell</title>
<desc id="d">Salida de ejemplo de ipconfig, recortada, con la línea Dirección IPv4 resaltada</desc>
<g transform="translate(0,0)">
<rect width="559" height="262" rx="10" fill="#012456"/>
<path d="M0,10 a10,10 0 0 1 10,-10 H549 a10,10 0 0 1 10,10 V34 H0 Z" fill="#2b2b2b"/>
<text x="14" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#e6e6e6">Windows PowerShell</text>
<g stroke="#bbbbbb" stroke-width="1.4" fill="none"><path d="M463,17 h10"/><rect x="497" y="12" width="10" height="10"/><path d="M531,12 l10,10 M541,12 l-10,10"/></g>
<rect x="387.3" y="190" width="106.7" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<g font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="13" fill="#eeedf0">
<text x="18" y="63" textLength="252.8" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PS C:\Users\estudiante&gt; ipconfig</text>
<text x="18" y="103" textLength="213.3" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Configuración IP de Windows</text>
<text x="18" y="143" textLength="244.9" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Adaptador de Ethernet Ethernet:</text>
<text x="18" y="183" textLength="363.4" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">   Sufijo DNS específico para la conexión. . :</text>
<text x="18" y="203" textLength="474.0" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">   Dirección IPv4. . . . . . . . . . . . . . : 192.168.10.20</text>
<text x="18" y="223" textLength="489.8" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">   Máscara de subred . . . . . . . . . . . . : 255.255.255.192</text>
<text x="18" y="243" textLength="466.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">   Puerta de enlace predeterminada . . . . . : 192.168.10.1</text>
</g>
<circle cx="504.0" cy="191.0" r="9.5" fill="#f2b33d" stroke="#012456" stroke-width="1.5"/>
<text x="504.0" y="195.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2a24">1</text>
</g>
</svg>
