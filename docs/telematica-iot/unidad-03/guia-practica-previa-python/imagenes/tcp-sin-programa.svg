<title id="t">Windows PowerShell</title>
<desc id="d">Salida de ejemplo de cliente_tcp.py cuando nadie espera: un error ConnectionRefusedError con el código 10061</desc>
<g transform="translate(0,0)">
<rect width="828" height="202" rx="10" fill="#012456"/>
