<text x="18" y="63" textLength="379.2" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PS C:\Users\estudiante\u3&gt; python cliente_tcp.py</text>
<text x="18" y="83" textLength="268.6" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Traceback (most recent call last):</text>
<text x="18" y="103" textLength="529.3" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">  File "C:\Users\estudiante\u3\cliente_tcp.py", line 4, in &lt;module&gt;</text>
<text x="18" y="123" textLength="316.0" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">    cliente.connect(("127.0.0.1", 5000))</text>
<text x="18" y="143" textLength="316.0" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">    ~~~~~~~~~~~~~~~^^^^^^^^^^^^^^^^^^^^^</text>
<text x="18" y="163" textLength="758.4" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">ConnectionRefusedError: [WinError 10061] No se puede establecer una conexión ya que el equipo de</text>
