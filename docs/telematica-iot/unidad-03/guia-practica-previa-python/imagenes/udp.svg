<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 258" width="480" height="258" role="img" aria-labelledby="t d">
<title id="t">Windows PowerShell, consola 1 (la que espera)</title>
<desc id="d">Dos consolas con los programas de UDP: la primera muestra el mensaje que llegó y quién lo envió; la segunda muestra la respuesta recibida</desc>
