<text x="18" y="83" textLength="221.2" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Escuchando en el puerto 5000</text>
<text x="18" y="103" textLength="410.8" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Llego b'temperatura=24.5' desde ('127.0.0.1', 51856)</text>
</g>
