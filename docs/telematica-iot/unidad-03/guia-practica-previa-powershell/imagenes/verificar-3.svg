<text x="18" y="63" textLength="1121.8" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PS C:\Users\estudiante-a\practica-u3&gt; .\verificar-plan.ps1 "sensores,60,64,0" "administracion,25,32,48" "servidores,10,16,40" "enlace,2,4,112"</text>
<text x="18" y="83" textLength="474.0" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">sensores        necesita  60   bloque  64   desde 0     cabe</text>
<text x="18" y="103" textLength="726.8" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">administracion  necesita  25   bloque  32   desde 48    no cabe: ese inicio no se puede usar</text>
<text x="18" y="123" textLength="726.8" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">servidores      necesita  10   bloque  16   desde 40    no cabe: ese inicio no se puede usar</text>
<text x="18" y="143" textLength="474.0" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">enlace          necesita   2   bloque   4   desde 112   cabe</text>
<text x="18" y="163" textLength="339.7" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Direcciones en bloques que caben: 68 de 256</text>
