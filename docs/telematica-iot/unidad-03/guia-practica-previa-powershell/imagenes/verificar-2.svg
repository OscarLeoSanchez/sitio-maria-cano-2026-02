<text x="18" y="63" textLength="1027.0" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PS C:\Users\estudiante-a\practica-u3&gt; .\verificar-plan.ps1 "sensores,60,60" "administracion,25,16" "servidores,10,16" "enlace,2,2"</text>
<text x="18" y="83" textLength="726.8" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">sensores        necesita  60   bloque  60   desde -     no cabe: ese tamano no se puede usar</text>
<text x="18" y="103" textLength="624.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">administracion  necesita  25   bloque  16   desde -     no cabe: faltan lugares</text>
<text x="18" y="123" textLength="474.0" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">servidores      necesita  10   bloque  16   desde -     cabe</text>
<text x="18" y="143" textLength="979.6" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">enlace          necesita   2   bloque   2   desde -     no cabe: esta herramienta solo acepta bloques de 4 direcciones o mas</text>
<text x="18" y="163" textLength="339.7" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Direcciones en bloques que caben: 16 de 256</text>
