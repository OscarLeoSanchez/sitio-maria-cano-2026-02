<g font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="13" fill="#cccccc">
<text x="18" y="63" textLength="481.9" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PS C:\Users\estudiante-a\practica-u3&gt; ping -n 2 192.168.10.45</text>
<text x="18" y="103" textLength="410.8" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Haciendo ping a 192.168.10.45 con 32 bytes de datos:</text>
<text x="18" y="123" textLength="450.3" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Respuesta desde 192.168.10.45: bytes=32 tiempo&lt;1m TTL=128</text>
<text x="18" y="143" textLength="450.3" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Respuesta desde 192.168.10.45: bytes=32 tiempo&lt;1m TTL=128</text>
<text x="18" y="183" textLength="316.0" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Estadísticas de ping para 192.168.10.45:</text>
<text x="18" y="203" textLength="434.5" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">    Paquetes: enviados = 2, recibidos = 2, perdidos = 0</text>
<text x="18" y="223" textLength="142.2" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">    (0% perdidos),</text>
<text x="18" y="243" textLength="410.8" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Tiempos aproximados de ida y vuelta en milisegundos:</text>
<text x="18" y="263" textLength="339.7" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">    Mínimo = 0ms, Máximo = 0ms, Media = 0ms</text>
<text x="18" y="303" textLength="481.9" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PS C:\Users\estudiante-a\practica-u3&gt; ping -n 2 192.168.10.99</text>
<text x="18" y="343" textLength="410.8" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Haciendo ping a 192.168.10.99 con 32 bytes de datos:</text>
<text x="18" y="363" textLength="355.5" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Tiempo de espera agotado para esta solicitud.</text>
<text x="18" y="383" textLength="355.5" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Tiempo de espera agotado para esta solicitud.</text>
<text x="18" y="423" textLength="316.0" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Estadísticas de ping para 192.168.10.99:</text>
<text x="18" y="443" textLength="434.5" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">    Paquetes: enviados = 2, recibidos = 0, perdidos = 2</text>
<text x="18" y="463" textLength="158.0" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">    (100% perdidos),</text>
