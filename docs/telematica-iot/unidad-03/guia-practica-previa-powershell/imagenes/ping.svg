<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 551 482" width="551" height="482" role="img" aria-labelledby="t d">
<title id="t">Windows PowerShell</title>
<desc id="d">Salida de ejemplo de dos intentos de ping: uno con respuesta y otro con tiempo de espera agotado</desc>
