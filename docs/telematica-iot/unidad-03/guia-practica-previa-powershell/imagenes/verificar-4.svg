<text x="18" y="63" textLength="782.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PS C:\Users\estudiante-a\practica-u3&gt; .\verificar-plan.ps1 "sensores,60,64,0" "servidores,10,16,32"</text>
<text x="18" y="83" textLength="687.3" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">sensores        necesita  60   bloque  64   desde 0     no cabe: se pisa con servidores</text>
<text x="18" y="103" textLength="671.5" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">servidores      necesita  10   bloque  16   desde 32    no cabe: se pisa con sensores</text>
<text x="18" y="123" textLength="331.8" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Direcciones en bloques que caben: 0 de 256</text>
