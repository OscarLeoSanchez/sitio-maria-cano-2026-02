<g font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="13" fill="#cccccc">
<text x="18" y="63" textLength="545.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PS C:\Users\estudiante-a\practica-u3&gt; tracert -d -h 8 -w 1000 8.8.8.8</text>
<text x="18" y="103" textLength="426.6" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Traza a 8.8.8.8 sobre caminos de 8 saltos como máximo.</text>
<text x="18" y="143" textLength="347.6" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">  1    &lt;1 ms    &lt;1 ms    &lt;1 ms  192.168.10.1</text>
<text x="18" y="163" textLength="347.6" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">  2     7 ms     3 ms     3 ms  10.223.128.1</text>
<text x="18" y="183" textLength="339.7" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">  3    11 ms    11 ms    10 ms  203.0.113.5</text>
<text x="18" y="203" textLength="308.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">  4    10 ms    10 ms    10 ms  8.8.8.8</text>
<text x="18" y="243" textLength="118.5" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Traza completa.</text>
</g>
