<title id="t">Windows PowerShell</title>
<desc id="d">Salida de ejemplo de tracert hacia 8.8.8.8 con tres saltos: la primera línea es la puerta de enlace</desc>
<rect width="615" height="262" rx="10" fill="#0c0c0c"/>
<path d="M0,10 a10,10 0 0 1 10,-10 H605 a10,10 0 0 1 10,10 V34 H0 Z" fill="#2b2b2b"/>
