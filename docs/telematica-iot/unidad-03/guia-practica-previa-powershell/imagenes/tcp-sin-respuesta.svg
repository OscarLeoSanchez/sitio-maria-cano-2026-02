<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1144 142" width="1144" height="142" role="img" aria-labelledby="t d">
<title id="t">Windows PowerShell</title>
<desc id="d">Salida de ejemplo de cliente-tcp.ps1 hacia una dirección que no contesta: el sistema informa que la parte conectada no respondió y tarda unos veintiún segundos</desc>
<rect width="1144" height="142" rx="10" fill="#0c0c0c"/>
<path d="M0,10 a10,10 0 0 1 10,-10 H1134 a10,10 0 0 1 10,10 V34 H0 Z" fill="#2b2b2b"/>
<text x="14" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#e6e6e6">Windows PowerShell</text>
<g stroke="#bbbbbb" stroke-width="1.4" fill="none"><path d="M1048,17 h10"/><rect x="1082" y="12" width="10" height="10"/><path d="M1116,12 l10,10 M1126,12 l-10,10"/></g>
<rect x="529.5" y="70" width="248.9" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<rect x="63.4" y="110" width="106.7" height="18" rx="3" fill="#f2b33d" fill-opacity="0.30" stroke="#f2b33d" stroke-opacity="0.9"/>
<g font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="13" fill="#cccccc">
<text x="18" y="63" textLength="560.9" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">PS C:\Users\estudiante-a\practica-u3&gt; .\cliente-tcp.ps1 192.0.2.99 5000</text>
<text x="18" y="83" textLength="932.2" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Fallo: Se produjo un error durante el intento de conexión ya que la parte conectada no respondió adecuadamente tras un</text>
<text x="18" y="103" textLength="1074.4" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">periodo de tiempo, o bien se produjo un error en la conexión establecida ya que el host conectado no ha podido responder 192.0.2.99:5000</text>
<text x="18" y="123" textLength="150.1" lengthAdjust="spacing" style="white-space:pre" xml:space="preserve">Tardo 21,1 segundos</text>
</g>
